[fluid-name]
toxic-sludge=Multiphase Liability Suspension

[fluid-description]
toxic-sludge=A transportable legal, biological, chemical, and administrative failure medium. Technically contained. Spiritually loose. Excellent for moving the problem somewhere quieter.

[technology-description]
toxic-sludge-condensation=Unlocks the conversion of industrial, radioactive, and corporate waste into multiphase liability suspension, allowing hazardous responsibility to travel by pipe before becoming a compact burnable biohazard opportunity.

Steam-Compressor=Completes the primitive seablock exit by joining water, clay, fish, and quarry infrastructure into steam compression and pressure handling.
stone-tools-iron=Improves primitive tool production by adding iron reinforcement to the stone-and-brick tooling line.
campfire=Establishes the approved combustion zone for early warmth, cooking, and visible evidence of effort.
beachpump=Authorizes shoreline water access under the Minimum Viable Hydration Initiative.
wood-pipes=Unlocks basic wooden pipework for moving water before proper industry has learned to be embarrassed.
wood-basin=Authorizes wet handling infrastructure for materials not yet important enough to deserve a tank.
workbench=Deploys the first productivity surface where survival labor can be misidentified as manufacturing.
thinking-hut=Begins primitive ideation by converting fish, hunger, and damp panic into internally recognized discovery.
clay-pit=Approves mud acquisition as a foundational material strategy.
pit-kiln=Authorizes primitive thermal compliance for brick, glass, and repeatable smoke.
growing-plot=Begins biological continuity planning for wood, food, and renewable disappointment.
cooked-fish=Unlocks basic fish cooking for crude nutrition and primitive science handling.
clay=Unlocks clay working from water, wood, and mineral muck.
brick=Unlocks brick firing, the first honest structural material in the chain.
crude-glass=Unlocks rough glassmaking for primitive apparatus, condensation work, and brittle progress.
wood-spear=Unlocks wooden spearcraft for fishing, defense, and pointed disagreements with nature.
cooking-fire=Unlocks controlled cooking and low-grade thermal processing, setting up meal-based research for everything after the primitive phase.
stone-water-wheel=Unlocks a primitive water-wheel pump: still weak, but meaningfully better than the beach pump’s miserable trickle.
aqueduct=Unlocks primitive aqueduct handling for moving water with gravity instead of wishful thinking.
stone-basin=Unlocks stone basin construction for sturdier wet processing and settlement work.
shack=Unlocks basic shack construction, a shelter one step above apology.
pondering-hovel=Unlocks the pondering hovel, where early research becomes heavier, stranger, and more expensive.
quarry=Unlocks repeatable stone and ore extraction from an island that would rather not cooperate.
solar-boiler=Unlocks low-tech solar steam generation using polished surfaces, heat, and questionable patience.
fish-pond=Unlocks fish ponds for stabilizing food supply and feeding the early biological chemistry chain.
meal=Establishes caloric compliance by proving food can be processed into both nutrition and paperwork.
stone-tools=Issues entry-level productivity implements without warranty, training, or replacement policy.
primitive-steam-powered-pump=Unlocks a rough steam-driven pump that trades elegance for pressure and usually wins.
steam-condenser=Unlocks vapor recovery so useful water and mineral leftovers can be reclaimed before anyone calls them losses.
calcifier=Unlocks the mineral recovery department, where scale, stone, and water are persuaded into feedstock.
shaler=Unlocks the waste-cracking compliance associate, turning filth into ore and ore into further obligations.
waste-processing-2=Improves calcifier and shaler throughput, turning early waste handling into a more reliable ore recovery chain.
waste-processing-3=Expands waste processing into automation-era mineral recovery and radioactive refinement.
waste-processing-4=Performs the practical implementation of authorized high-throughput waste processing after the paperwork has absorbed the interesting objections.
waste-processing-5=Performs final waste-processing throughput after authorization has converted consequences into schedule pressure.
mineral-fractionation=Unlocks the seawater mineral chain after requisition and work-order authority establish that salt may be processed on purpose.
bio-reactive-processing=Unlocks fish-derived biochemical processing after certification and evaluation submission make the smell procedurally acceptable.
biomineral-synthesis=Unlocks biomineral synthesis once compliance packets and audit-survivable deliverables prove the materials are complicated enough to be approved.
stabilized-emulsion-systems=Unlocks stabilized gels and froths after audit survivability and stakeholder review turn unstable mixtures into deliverables.
pre-encabulation-materials=Unlocks the first integrated encabulation materials after stakeholder review and liability containment sanitize the procurement language.
advanced-encabulation-substrates=Unlocks hyperphase, retrograde, and duplexed substrates once liability containment and board witnessing make advanced failure modes presentable.
Encabulation-research=Unlocks baseline encabulation once audit-survivable deliverables prove the machinery is sufficiently documented to begin failing productively.
Turbo-Encabulation-research=Unlocks turbo encabulation after stakeholder review summarizes the new risks into something printable.
Hyper-Encabulation-research=Unlocks hyper encabulation once liability containment establishes where the blame should not go.
Rubberized-timber=Unlocks timber treatment for flexible crude structural parts and mechanical builds.
iron-walls=Unlocks iron wall research for sturdier defensive construction.
modular-tank-research=Implements the authorized tracked compliance platform for field-aligned dispute resolution.
modular-tank-research2=Implements W.L.S.K. field retrofits after permissioning confirms survivability is an approved narrative.
modular-tank-research3=Implements specialist tank platforms once mine and rocket outcomes have been administratively normalized.
mechanized-infantry-research=Implements support logistics for personnel expected to operate near problems created by other departments.
new-munitions=Authorizes expanded kinetic communication options for stakeholders resistant to ordinary deliverables.
organic-explosives=Unlocks synthetic explosive production under risk-assessed work orders and tank casing approval.
organic-explosives2=Performs the practical portion of the approved explosives escalation package, safely outside the meeting where it was blessed.
organic-explosives3=Implements heavy synthetic explosives and WMD shell production after the word “catastrophe” is removed from the deck.
super-tank-research=Implements the authorized heavy tank platform now that actual engineering has been separated from the approval event.
super-tank-research2=Authorizes strategic annihilation capacity through the sacred doctrine of docketed inevitability.
tank-recall=Enhances tanks with recall teleportation for commanders who view logistics as a personal insult and procurement as a suggestion.
charcoal-processing=Allows wood to be converted into a darker, less accountable form of fuel and documentation residue.
wood-pulp-processing=Begins the heroic reduction of useful timber into damp administrative substrate.
crude-paperwork=Unlocks the first writable surface sufficiently unpleasant to qualify as corporate documentation.
basic-requisitioning=Allows resources to be requested incorrectly before being denied correctly.
work-order-generation=Converts vague desire into a document that can be misplaced with procedural confidence.
work-order-certification=Applies sufficient stamps, residue, and meal-adjacent pressure to make a work order appear deliberate.
evaluation-submission=Permits completed work orders to be submitted into a process nobody fully controls.
preliminary-risk-assessment=Identifies obvious risks, names them confidently, and assigns them to a later meeting.
risk-assessed-authorization=Allows risk to be considered addressed once it has been named, filed, and surrounded by witnesses.
compliance-packetization=Combines risk, paperwork, and technically related materials into a packet acceptable to people who will never open it.
audit-ready-deliverables=Prepares materials to survive external review by making them dense, expensive, and unpleasant to question.
stakeholder-review-process=Summarizes operational reality into a format compatible with investor optimism.
liability-containment=Improves safety by ensuring liability remains inside an approved reporting vessel.
board-review-procedure=Unlocks the ceremonial observation of decisions after reversal has become financially impolite.
board-advisory-risk-assessment=Completes the final executive ritual by proving that every catastrophic outcome has been anticipated, categorized, and assigned to someone outside the room.
ceramic-lattice-conditioning=Unlocks ceramic lattice products after evaluations and risk authorization certify that grinding minerals into stranger shapes is intentional.
organic-substrate-conditioning=Unlocks organic substrates after submitted evaluations and risk-assessed authorization surround the biological slurry with witnesses.
brine-conditioning=Unlocks the brine/emulsion branch once preliminary risk and risk-assessed authorization agree that seawater can be made worse.
ionic-phase-conditioning=Unlocks charged ionic media and electro-phase precursors under risk-assessed authorization, stopping short of the compliance packet deadlock.
alumated-plate-research=Authorizes alumated plating for encabulator frames and armored structures under the early compliance regime.
tank-casing-research=Unlocks basic and reinforced tank casing work once certified paperwork begins following the metal around.
encabulator-support-componentry=Unlocks support components for encabulator modules under submitted evaluations and risk-assessed work orders.
retro-encabulator-research=Unlocks retro encabulation after compliance packetization certifies that the first serious encabulator failure mode is planned.
framulated-encabulator-research=Unlocks the framulated encabulator once board review procedure approves the expensive part of the bad idea.
sperving-arm-research=Unlocks the first sperving arm under audit-survivable authorization and early encabulator support.
ducted-sperving-arm-research=Unlocks ducted sperving arms after stakeholder review approves the efficiency narrative.
duplexed-sperving-arm-research=Unlocks duplexed sperving arms once liability containment agrees the savings are worth the paperwork.
explosive-encabulation-engineering=Unlocks encabulated explosive engineering after compliance packets and turbo encabulation make ordnance sound managed.
industrial-coke-processing=Unlocks industrial coke and rubberized timber once liability-contained reports make the smoke somebody else’s issue.
encabulated-waste-recovery=Unlocks encabulated waste recovery after audit-survivable deliverables and casing research frame the toxic loop as resource efficiency.
waste-processing-4-authorization=Internal authorization for the next waste-processing escalation before non-corporate implementation-chain execution begins.
waste-processing-5-authorization=Internal board-facing authorization for final waste-processing escalation and mass radioactive consequences.
encabulated-device-integration-authorization=Corporate authorization proving encabulator devices may be integrated into tank production without anyone in the room owning the consequences.
encabulated-device-integration=Performs authorized device integration after the liability waiver has separated engineering from the approval event.
modular-tank-research-authorization=Corporate authorization for modular tank research, issued before the non-corporate implementation chains begin the practical work.
modular-tank-research2-authorization=Corporate authorization for W.L.S.K. tank upgrades and improved field survivability.
modular-tank-research3-authorization=Corporate authorization for specialist mine and rocket tank platforms.
mechanized-infantry-authorization=Internal authorization for infantry support logistics, boxed ammunition, and fish-based recovery kits.
new-munitions-authorization=Corporate authorization for chemical munitions and the paperwork they will inevitably create.
organic-explosives2-authorization=Internal authorization for the second synthetic explosives improvement package.
organic-explosives3-authorization=Internal authorization for the third synthetic explosives package and WMD shell escalation.
super-tank-authorization=Permits heavy battle tank production after the board confirms that all consequences have been placed downstream.
super-tank-wmd-authorization=Board-level authorization for Windlass Mass Desynchronizer artillery, because apocalypse must be properly docketed.

