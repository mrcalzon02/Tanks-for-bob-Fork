[recipe-description]
campfire=Assembles a basic campfire from wood, producing the first controllable heat source on the island.
beachpump=Builds a crude beach pump for pulling seawater into the rest of the survival chain.
wood-basin=Builds a wooden basin for crude settling, washing, and wet-process handling.
shaler1=Feeds industrial waste and steam through the shaler to recover the first scraps of iron ore.
shalera=Loads loose industrial waste into a canister so it can be moved without decorating the operator.
shalerb=Empties an industrial waste canister back into loose process waste.
shalerc=Loads radioactive waste into a sealed canister for safer handling and later abuse.
shaler3=Decants a radioactive waste canister back into processable radioactive waste.
Calcifier-pro-2=Washes stone and water through an improved calcifier cycle, multiplying rock and shedding dirty byproduct.
Calcifier-pro-3=Pushes a heavier wet-stone load through the calcifier for larger mineral recovery.
Calcifier-pro-4=Uses steam heat to accelerate calcification and produce a more serious waste stream.
Calcifier-pro-5=Runs industrial-scale steam calcification for bulk stone recovery and generous industrial filth.
shaler2=Converts industrial waste and steam into a mixed iron and copper ore recovery stream.
shaler4=Runs a hotter shaler pass that pulls ore from waste while beginning radioactive contamination.
shaler5=Processes a heavy industrial waste charge for bulk ore and stronger radioactive residue.
shaler6=Runs mass waste shaling at full ugly throughput, producing ore by the cartload and waste by the warning label.
radio-refine-2=Refines radioactive waste into uranium ore with a small sulfuric acid recovery stream.
radio-refine-3=Refines a larger radioactive batch into uranium ore and useful acid byproduct.
radio-refine-4=Runs industrial radioactive refining for serious uranium recovery.
radio-refine-5=Mass-refines radioactive waste into uranium and acid at a scale that deserves a fenced perimeter.
Steam-Charge=Uses steam and waste heat to squeeze another iron-bearing scrap out of the shaler line.
Steam-condenserA=Condenses steam through wood and primitive filtration to recover stone and dirty residue.
workbench=Builds the first proper workbench, where handcrafting starts wearing a tie.
workbenchA=Assembles a sturdier workbench from iron plate when woodcraft is no longer enough.
thinking-hut=Builds a thinking hut for early research and increasingly dangerous ideas.
clay-pit=Builds a clay pit for organized mud extraction.
pit-kiln=Combines a clay pit and campfire into a primitive kiln for fired materials.
growing-plot=Builds a growing plot for renewable wood and early biological recovery.
stone=Quarries loose stone by hand from whatever ground the sea has not stolen yet.
Trees=Cultivates trees from the growing plot line for wood, fuel, and structural desperation.
harvest-fish=Harvests fish from controlled water access for food and biological inputs.
catch-fish=Uses a simple wooden rig to catch fish faster than dignity would recommend.
Seared-fish=Cooks raw fish over wood into something scientifically useful and nutritionally negotiable.
clay=Mixes stone, water, and shoreline muck into usable clay.
brick=Fires clay into brick using the pit kiln.
crude-glass=Burns fuel hot enough to produce rough glass for primitive apparatus.
wood-spear=Shapes wood into a spear for early defense and fish-related aggression.
Sharp-stick=Cuts wood into sharpened stick ammunition.
cooking-fire=Builds a more controlled cooking fire from brick and an existing campfire.
stone-water-wheel=Builds a stone water wheel for the first mechanical power experiments.
pondering-hovel=Upgrades the thinking hut into a sturdier pondering hovel.
quarry=Builds a quarry for repeatable stone and ore extraction.
solar-boiler=Builds a solar boiler to raise steam without feeding it burnable fuel.
fish-pond=Builds a fish pond to stabilize food and biological feedstock supply.
meal=Prepares seared fish into a more useful research ration.
steam-meal=Steam-cooks fish into bulk meals with less charm and better throughput.
stone-tools=Makes crude stone tools from stone and wood.
stone-tools-iron=Improves stone tool production using iron sticks and stone brick.
Canister=Forges rough canisters from stone tools and ore.
Charged-Canister=Compresses steam into a canister for portable stored pressure.
UnCharge-Canister=Vents a charged canister back into usable steam and an empty shell.
primitive-steam-powered-pump=Builds a steam-powered pump from brick and wood.
steam-condenser=Builds a steam condenser from crude glass and brick.
calcifier=Builds a calcifier for mineral recovery and scaling operations.
Calcifier-pro=Runs the basic calcifier cycle to turn wet stone feedstock into more stone.
shaler=Builds the shaler machine for waste cracking and ore recovery.
Steam-Compressor=Builds a steam compressor from a shaler and cooking fires.
quarry-iron-ore=Uses stone tools and brick to quarry iron ore from rough ground.
quarry-copper-ore=Uses stone tools and brick to quarry copper ore from rough ground.
quarry-iron-orea=Quarries iron ore with improved stone brick support.
quarry-copper-oreb=Quarries copper ore with improved stone brick support.
trace-mineral-slurry=Suspends clay in seawater to capture the first trace minerals.
saline-particulate=Dries trace slurry into salt grit and mineral particulates.
ionic-scum=Calcifies saline particulate into a reactive ion-rich crust and a little waste.
heavy-brine-fraction=Steam-separates saline particulate into a dense brine fraction.
microcrystal-sediment=Calcifies heavy brine with stone into microcrystalline sediment.
fish-oil-residue=Renders raw fish into oily residue for early biochemical work.
protein-slurry=Macerates fish and water into protein slurry.
calcified-bone-dust=Burns fish remains into mineral-rich bone dust.
enzyme-paste=Combines protein slurry and rendered organics into a crude catalyst paste.
rendered-organics=Steam-renders fish into organic feedstock and bonus oil residue.
marseline-compound=Blends mineral slurry, saline particulate, and enzyme paste into marseline compound.
bioceramic-grit=Fires bone dust into hard bioceramic grit.
hydrocoptic-crystal=Grows hydrocoptic crystals from sediment, glass, and water.
amulite-flakes=Shales marseline compound and hydrocoptic crystal into amulite flakes.
phase-reactive-granules=Combines ionic scum, bioceramic grit, and copper into reactive granules.
oscillated-lubricant=Stabilizes fish oil with ionic scum into vibration-tolerant lubricant.
stabilized-brine-gel=Binds heavy brine with enzyme paste into a controllable gel.
dielectric-chowder=Mixes protein slurry, bioceramic grit, and copper cable into a dielectric slurry.
pre-turbulated-emulsion=Combines lubricant, brine gel, and reactive granules into pre-turbulated emulsion.
viscoelastic-froth=Foams rendered organics, brine gel, and glass into flexible froth.
executive-marseline-resin=Upgrades marseline compound with lubricant and amulite into high-grade resin.
encabuloy-alloy=Alloys plates, crystal, and bioceramic grit into encabuloy stock.
hyperphase-matrix=Locks reactive granules, dielectric chowder, and circuitry into a hyperphase matrix.
retrograde-polymer-sheet=Forms resin, froth, and circuits into retrograde polymer sheet.
duplexed-substrate=Laminates alloy and polymer sheet into a duplexed encabulator substrate.
Hydrocoptic-marselvanes=Assembles hydrocoptic marselvanes for wet-phase encabulator alignment.
PhaseDetractor=Assembles a phase detractor for keeping unstable reactions on a shorter leash.
Alumatedplate=Produces alumated plate for hardening encabulator and vehicle components.
Encabulator=Assembles the baseline encabulator from exotic components and poor institutional restraint.
DuctedSpervingArm=Ducts a sperving arm for cleaner movement of exactly the wrong energies.
TurboEncabulator=Upgrades encabulation into a faster, louder, more expensive failure mode.
Retro-Encabulator=Assembles a retro encabulator stage for reverse-coupled phase handling.
HyperEncabulator=Builds the hyper encabulator, where the process stops asking permission.
FramulatedEncabulator=Framulates the encabulator chassis so the impossible parts stay bolted down.
Cradinal-grametter=Builds a cradinal grametter for measuring what no responsible engineer named.
tank-ammo-assembling-machine=Builds a dedicated ammunition assembly machine for heavy ordnance work.
tank-light-chasis-wlsk=Assembles a WLSK light chassis upgrade kit for field survival and armor improvements.
tank-ammo-universal-explosive=Packs a universal explosive filler for heavy tank ammunition.
tank-ammo-universal-explosive-synthetic=Synthesizes universal explosive filler from less convenient feedstocks.
tank-ammo-explosive-synthetic=Derives explosive compounds from synthetic organic chemistry.
tank-ammo-industrial-coke=Processes industrial coke for ammunition chemistry and heavy manufacturing.
tank-ammo-Reprocessing=Reprocesses radioactive waste into usable military-industrial materials.
tank-ammo-Explosive-Engineering=Research-grade explosive engineering disguised as a production recipe.
Rubberized-timber=Treats timber into a flexible structural material for crude mechanical builds.
tank-ammo-ecozone=Processes the so-called ecozone path for alternative explosive inputs.
tank-ammo-casing=Forms heavy ammunition casings for tank ordnance.
tank-ammo-reinforced-casing=Reinforces ammunition casings for larger charges and worse ideas.
ore-from-waste=Extracts usable ore from industrial waste through low-grade reprocessing.
ore-from-wasteb=Runs an alternate waste-to-ore recovery route.
ore-from-waster=Processes radioactive waste into ore-bearing residue.
land-mine-poison=Assembles a chemical land mine for area denial.
fish-kit=Packs a fish kit for field recovery, science, and improvised survival logistics.
Trees-with-tools=Uses stone tools to improve tree harvesting, returning the tools while producing a better wood yield.
stone-with-tools=Uses stone tools to quarry more stone from the same miserable ground, with the tools returned for further punishment.
catch-fish-with-tools=Uses wood and stone tools to catch a larger fish yield while keeping the tools in service.
clay-with-tools=Works stone, water, and stone tools into a larger clay batch without consuming the tools.
hand-chip-iron-ore=Chips one iron ore out of stone by hand, for emergencies where pride has already left the island.
hand-scrape-wood=Scrapes a single unit of wood out of stone-tool labor, a fallback recipe with the efficiency of a punishment detail.
hand-break-fish-for-stone=Breaks down fish with stone tools into a desperate stone recovery route that raises several biological questions.
hydrolyzed-suspension=Hydrolyzes saline particulate and trace slurry with stone, ore, copper, and wood into the first pre-encabulation wet feedstock.
phase-diluted-brine=Dilutes hydrolyzed suspension with ore, stone, and wood into a brine phase stable enough for follow-on handling.
osmotic-residue=Presses hydrolyzed suspension through stone, brick, and ore into osmotic residue while producing industrial waste.
gradient-saline-matrix=Builds a copper-gradient saline matrix around crude glass and hydrolyzed suspension.
biphasic-brine-gel=Combines phase-diluted brine and osmotic residue with iron reinforcement into a two-phase brine gel.
salinity-locked-emulsion=Locks gradient saline matrix and osmotic residue into a copper-and-glass emulsion.
hydrocoptic-precursor=Combines brine gel, locked emulsion, gears, plates, glass, and stone into a hydrocoptic precursor.
denatured-organic-base=Denatures protein slurry and rendered organics with wood, stone, and ore into a stable organic base.
enzyme-saturated-mass=Saturates denatured organic base with enzyme paste and crude hardware into enzyme-bearing mass.
lipid-carrier-gel=Binds denatured organics and fish oil into a lipid gel with enough mineral support to travel downstream.
bio-reactive-slurry=Combines denatured organic base, fish oil, and copper feedstock into a reactive biological slurry.
catalytic-organic-medium=Blends enzyme-saturated mass and lipid carrier gel with cable, brick, and iron into a catalytic organic medium.
reactive-enzyme-binder=Reinforces bio-reactive slurry and enzyme-saturated mass into a binder for unstable organic components.
bio-synthetic-precursor=Merges catalytic medium and enzyme binder with gears, plates, cable, wood, and brick into a bio-synthetic precursor.
crystalline-agglomerate=Combines microcrystal sediment and bone dust with stone, brick, and ore into a rough crystalline agglomerate.
fractured-lattice-mass=Breaks crystalline agglomerate into a fractured lattice mass reinforced with mixed ore.
ceramic-seed-grain=Seeds crystalline agglomerate into ceramic grain using brick, stone, and iron stick structure.
mineral-phase-fragments=Splits crystalline agglomerate into mineral phase fragments with mixed ore and brick support.
ceramic-lattice-core=Combines fractured lattice mass and ceramic seed grain into a reinforced ceramic lattice core.
compressed-crystal-bed=Compresses mineral phase fragments and fractured lattice mass into a crystal bed with copper and gear alignment.
bioceramic-preform=Fuses ceramic lattice cores and compressed crystal beds into a dense bioceramic preform.
charged-ionic-matrix=Charges ionic scum with copper and mixed ore into an electrical phase matrix.
dielectric-suspension=Suspends charged ionic matrix through copper cable and metal support into a dielectric medium.
conductive-residue=Processes charged ionic matrix with iron and copper plate into conductive residue.
phase-unstable-granulate=Combines charged ionic matrix and saline particulate into unstable granulate for phase-reactive handling.
balanced-reactive-medium=Balances dielectric suspension and conductive residue into a reactive medium with gears, cable, and plate stock.
phase-primed-carrier=Primes unstable granulate and dielectric suspension into a phase carrier for later encabulation steps.
electro-phase-precursor=Combines balanced reactive medium and phase-primed carrier into the electro-phase bridge before higher encabulation.
tank-assembling-machine=Assembles a dedicated tank factory for turning heavy components into tracked business decisions.
desperation-gather-fish=A terrible hand fallback for collecting one fish when the island has not yet agreed to support life.
desperation-scrape-driftwood=A miserable hand fallback for scraping one usable piece of wood out of the shoreline.
desperation-pick-stone=A slow hand fallback for prying one stone from the world by spite alone.
desperation-landfill=Turns a painful pile of stone into one more patch of ground to stand on.
charcoal=Burns wood down into accountability charcoal for fuel, ink, and the first dirty fingerprints of bureaucracy.
wood-pulp=Reduces wood and water into administrative pulp suitable for forms, folders, and the slow murder of useful timber.
crude-paper=Presses pulp and charcoal into the first surface capable of holding blame in a legible format.
ink=Combines charcoal, fish oil, and water into formalized blame-assignment fluid.
staples=Cuts crude metal fasteners so documents can remain attached to one another and detached from reality.
stamps=Builds reusable approval devices from wood, glass, and ink for faster procedural theater.
folder=Turns paper and pulp into a concealment device that improves audit survivability.
clipboard=Creates a portable oversight amplifier for looking legitimate near unresolved problems.
requisition-slip=Creates a resource desire intake slip from crude paper, ink, and fish oil residue.
work-order-slip=Escalates requisitions into work orders with meal, ink, staples, and a generous failure path into administrative residue.
certified-work-order=Consumes work orders, mineral slurry, fish science, stamps, and staples to produce certified authority with lossy waste.
submitted-evaluation=Packages certified work into a submitted evaluation using crude glass, fish residue, clipboard handling, and more staples.
risk-assessment=Transforms submitted evaluation mass into named risk recognition while leaving most of the risk where it was.
risk-assessed-work-order=Binds risk assessments into a foldered work order that claims risk has been addressed.
corporate-waste-reprocessing=Recovers a fraction of administrative substrate from failed approvals while preserving the full spiritual toxicity of the process.
decompose-certified-work-order=Invalidates certified authority into recyclable fragments after discovering the approval was issued by the wrong desk.
decompose-submitted-evaluation=Returns an evaluation to component documents once everyone agrees it was submitted too close to responsibility.
decompose-risk-assessed-work-order=Recovers paperwork from a risk-assessed work order without recovering any actual safety.
decompose-audit-ready-deliverable=Dismantles audit readiness into reusable compliance fragments and one quiet organizational shame event.
compliance-packet=Combines risk, paperwork, and technically related materials into a packet acceptable to people who will never open it.
audit-ready-deliverable=Prepares materials to survive external review by making them dense, expensive, and unpleasant to question.
stakeholder-review-summary=Summarizes operational reality into a format compatible with investor optimism.
liability-contained-report=Cans stakeholder review into a report vessel engineered to keep liability inside the document and outside the room.
board-review-docket=Assembles reports, hyperphase material, polymer sheets, and stamps into a board-facing docket of pre-decided outcomes.
board-advisory-risk-assessment=Consumes the board docket, top encabulator modules, radioactive waste, and liability reports to produce final strategic permission.

industrial-waste-to-toxic-sludge=Reclassifies industrial waste as a pumpable circularity asset pending remote combustion.
radioactive-waste-to-toxic-sludge=Improves radioactive waste optics by making it harder to point at individually.
corporate-waste-to-toxic-sludge=Liquefies failed documentation into a toxic administrative slurry suitable for relocation away from anyone authorized to complain.
compress-toxic-sludge=Converts distributed liability into a compact burnable biohazard opportunity. This is not remediation. This is logistics.

