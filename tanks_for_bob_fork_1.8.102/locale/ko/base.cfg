[recipe-description]
industrial-waste-to-toxic-sludge=산업용 폐기물 To Toxic Sludge. 위험하고 더럽지만, 재분류하면 자원 효율이라고 부를 수 있는 물질입니다. 문제를 다른 곳으로 옮기기에는 매우 편리합니다.
radioactive-waste-to-toxic-sludge=방사성 폐기물 To Toxic Sludge. 위험하고 더럽지만, 재분류하면 자원 효율이라고 부를 수 있는 물질입니다. 문제를 다른 곳으로 옮기기에는 매우 편리합니다.
corporate-waste-to-toxic-sludge=Corporate 폐기물 To Toxic Sludge. 책임을 처리한 것처럼 보이게 만드는 기업 서류입니다. 실제 위험은 거의 그대로지만, 적어도 감사에서 읽을 수 있는 형태가 되었습니다.
compress-toxic-sludge=Compress Toxic Sludge. 책임을 처리한 것처럼 보이게 만드는 기업 서류입니다. 실제 위험은 거의 그대로지만, 적어도 감사에서 읽을 수 있는 형태가 되었습니다.

