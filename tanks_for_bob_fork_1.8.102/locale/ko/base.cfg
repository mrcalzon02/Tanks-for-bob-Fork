[entity-description]
wmdartillery-ammo=윈들라스 질량 비동기화 포탄. 현장용 강경 의사소통 수단입니다. 조달 문서로 감싸면 파괴력이 관리 가능한 것처럼 보입니다.
tank-assembling-machine=장갑, 인캐뷸레이션, 그리고 충분한 승인을 궤도식 기업 자세로 조립하는 중제작 설비입니다.
tank-ammo-assembling-machine=폭발물이 자신의 분기별 목적을 발견하도록 장려하는 병기 정렬 부서입니다.
tank-ammo-Radioactivewaste=봉쇄, 재분류, 또는 경영진의 낙관주의를 기다리는 장기 전망 방사선 자산입니다.
tank-ammo-Industrialwaste=지속가능성 부서가 순환형이라고 부를 수 있을 때까지 농축된 예산 외 산업 외부효과입니다.
tank-ammo-Reprocessing=당신 인생의 모든 엔지니어를 위한 방사성 폐기물 재처리입니다.
Seared-fish=구운 생선입니다. 기술적으로는 음식이고, 정신적으로는 온보딩이며, 청구서를 쓸 만큼은 유용합니다.
solar-boiler=태양열 보일러. 원시 생존 작업을 운영 부서가 진척이라고 부를 수 있는 최소한의 기반시설로 바꾸기 위한 도구입니다.
primitive-steam-powered-pump=원시 증기 구동 펌프. 원시 생존 작업을 운영 부서가 진척이라고 부를 수 있는 최소한의 기반시설로 바꾸기 위한 도구입니다.
campfire=Campfire. 승인된 공정에서 사용되는 중간 요소입니다. 현장에서도 유용하지만, 서류상으로는 더 유용합니다.
beachpump=Beachpump. 원시 생존 작업을 운영 부서가 진척이라고 부를 수 있는 최소한의 기반시설로 바꾸기 위한 도구입니다.
wood-basin=목재 수조. 현장용 강경 의사소통 수단입니다. 조달 문서로 감싸면 파괴력이 관리 가능한 것처럼 보입니다.
workbench=Workbench. 승인된 공정에서 사용되는 중간 요소입니다. 현장에서도 유용하지만, 서류상으로는 더 유용합니다.
thinking-hut=Thinking Hut. 생선, 단백질, 복지 비슷한 생화학을 공장이 사용할 수 있을 만큼 불쾌한 원료로 전환한 것입니다.
clay-pit=점토 구덩이. 승인된 공정에서 사용되는 중간 요소입니다. 현장에서도 유용하지만, 서류상으로는 더 유용합니다.
pit-kiln=구덩이 가마. 책임을 처리한 것처럼 보이게 만드는 기업 서류입니다. 실제 위험은 거의 그대로지만, 적어도 감사에서 읽을 수 있는 형태가 되었습니다.
growing-plot=재배 구역. 생선, 단백질, 복지 비슷한 생화학을 공장이 사용할 수 있을 만큼 불쾌한 원료로 전환한 것입니다.
cooking-fire=조리용 불. 경영진이 위험을 직접 만지지 않고 바라보고, 축복하고, 다른 부서로 분배하기 위한 승인된 산출물입니다.
stone-water-wheel=석제 물레방아. 승인된 공정에서 사용되는 중간 요소입니다. 현장에서도 유용하지만, 서류상으로는 더 유용합니다.
pondering-hovel=연못ering 오두막. 책임을 처리한 것처럼 보이게 만드는 기업 서류입니다. 실제 위험은 거의 그대로지만, 적어도 감사에서 읽을 수 있는 형태가 되었습니다.
quarry=채석장. 승인된 공정에서 사용되는 중간 요소입니다. 현장에서도 유용하지만, 서류상으로는 더 유용합니다.
fish-pond=생선 연못. 생선, 단백질, 복지 비슷한 생화학을 공장이 사용할 수 있을 만큼 불쾌한 원료로 전환한 것입니다.
steam-condenser=증기 응축기. 광물을 부수고, 정렬하고, 또는 설득해서 더 비싼 중간재로 만든 것입니다.
calcifier=Calcifier. 광물을 부수고, 정렬하고, 또는 설득해서 더 비싼 중간재로 만든 것입니다.
shaler=Shaler. 책임을 처리한 것처럼 보이게 만드는 기업 서류입니다. 실제 위험은 거의 그대로지만, 적어도 감사에서 읽을 수 있는 형태가 되었습니다.
Steam-Compressor=Steam 압축기. 승인된 공정에서 사용되는 중간 요소입니다. 현장에서도 유용하지만, 서류상으로는 더 유용합니다.
land-mine-poison=Land Mine Poison. 현장용 강경 의사소통 수단입니다. 조달 문서로 감싸면 파괴력이 관리 가능한 것처럼 보입니다.
BeachPump=Beachpump. 원시 생존 작업을 운영 부서가 진척이라고 부를 수 있는 최소한의 기반시설로 바꾸기 위한 도구입니다.

