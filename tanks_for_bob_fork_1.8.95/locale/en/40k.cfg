[tfbf-40k-entity-description]
wmdartillery-ammo=A martial rite of the Forge: windlass Mass Desyncronizer Munition Rite The Machine Spirit hungers for calibration and sanctioned violence.
tank-assembling-machine=A martial rite of the Forge: a heavy fabrication station where armor, Omnissian encabulation, and enough authorization are assembled into tracked administratum posture. The Machine Spirit hungers for calibration and sanctioned violence.
tank-ammo-assembling-machine=A martial rite of the Forge: an ordnance alignment department where explosives are encouraged to discover their quarterly purpose. The Machine Spirit hungers for calibration and sanctioned violence.
tank-ammo-Radioactivewaste=By sealed decree of the red-robed priesthood, a long-horizon radiological asset currently awaiting containment, reclassification, or magisterial optimism. Handle as blessed contamination, not as a mistake.
tank-ammo-Industrialwaste=By sealed decree of the red-robed priesthood, an unbudgeted industrial externality concentrated until Sustainability can call it circular. Handle as blessed contamination, not as a mistake.
tank-ammo-Reprocessing=A martial rite of the Forge: radiant Atomantic Sin reprocessing for all the engineers in your life. The Machine Spirit hungers for calibration and sanctioned violence.
Seared-fish=A genetor-approved biomass rite: seared piscine biomass: technically food, spiritually onboarding, and useful enough to be requisitioned. Flesh remains weak, but occasionally useful as input.
solar-boiler=Forge-world annotation: a low-tech solar boiler that bullies aqua-mechanicus into sanctified vapor while pretending the mirror-polished lignum was always temporary. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
primitive-steam-powered-pump=Forge-world annotation: primitive Sanctified Vapor-Powered Pump The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
campfire=Forge-world annotation: the approved combustion zone for warmth, food, and the first visible evidence that operations has begun. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
beachpump=Forge-world annotation: a minimum viable hydration pump producing a wooden trickle of seawater under emergency operations doctrine. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
wood-basin=Forge-world annotation: a wet-handling asset for early process work that has not yet earned a battle-crawler, vat, or adult supervision. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
workbench=Forge-world annotation: an entry-level output benediction surface where survival labor is first exposed to process discipline. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
thinking-hut=Forge-world annotation: a primitive ideation shelter where piscine biomass noospheric doctrine, damp walls, and early research are converted into actionable confusion. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
clay-pit=Forge-world annotation: an approved mud acquisition site for converting shoreline inconvenience into foundational material. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
pit-kiln=Forge-world annotation: a primitive thermal rite-compliance chamber for turning consecrated clay into kiln-blessed brick, glass, and repeatable smoke. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
growing-plot=Forge-world annotation: a biological continuity plot where lignum, food, and fragile optimism are grown under informal supervision. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
cooking-fire=Forge-world annotation: a controlled thermal onboarding device for meals, rendering, and early morale-neutral processing. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
stone-water-wheel=Forge-world annotation: a primitive aqua-mechanicus-handling upgrade that proves operations can improve misery without eliminating it. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
pondering-hovel=Forge-world annotation: an expanded ideation hovel where meals and paperwork become authorized mistakes at improved throughput. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
quarry=Forge-world annotation: a primitive resource extraction site for persuading uncooperative ground to join the quarterly plan. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
fish-pond=A genetor-approved biomass rite: a biological retention pond for stabilizing protein supply, piscine biomass noospheric doctrine, and wellness-adjacent chemistry. Flesh remains weak, but occasionally useful as input.
steam-condenser=Forge-world annotation: a recovery department for stealing aqua-mechanicus and mineral leftovers back from vapor before Finance notices. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
calcifier=Forge-world annotation: a mineral recovery department with no budget, no ventilation, and suspiciously useful throughput. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
shaler=Forge-world annotation: a effluvia-cracking rite-compliance associate that turns filth into ore and ore into new reporting obligations. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
Steam-Compressor=Forge-world annotation: a pressure-handling middle manager that forces vapor into canisters and calls the consequences stored value. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
land-mine-poison=A martial rite of the Forge: a placed chemical buried denial relic for rapid area denial and delayed environmental correspondence. The Machine Spirit hungers for calibration and sanctioned violence.
BeachPump=Forge-world annotation: a minimum viable hydration pump producing a wooden trickle of seawater under emergency operations doctrine. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.


