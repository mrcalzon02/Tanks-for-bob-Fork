[tfbf-40k-item-description]
campfire=Forge-world annotation: the approved combustion zone for the first nights, when progress is measured in smoke, calories, and visible effort. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
beachpump=Forge-world annotation: the minimum viable hydration pump: a wooden trickle of seawater issued by Operations to prove the site is not technically abandoned. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
wood-basin=Forge-world annotation: a wet-handling basin for materials not yet important enough to receive a battle-crawler, vat, or meaningful budget. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
workbench=Forge-world annotation: an entry-level output benediction surface where raw survival is first exposed to process discipline. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
thinking-hut=Forge-world annotation: a primitive ideation shelter where damp walls, piscine biomass noospheric doctrine, and early desperation are converted into strategic direction. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
clay-pit=Forge-world annotation: an approved mud acquisition site for turning shoreline inconvenience into foundational material. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
pit-kiln=Forge-world annotation: a primitive thermal rite-compliance chamber that converts consecrated clay, fuel, and patience into durable excuses. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
growing-plot=Forge-world annotation: a biological continuity plot for lignum, food, and fragile optimism under informal supervision. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
clay=Forge-world annotation: wet mineral earth, useful once beaten into shape and told to behave. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
brick=Forge-world annotation: fired consecrated clay made solid enough to build with and cheap enough to effluvia repeatedly. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
crude-glass=Forge-world annotation: rough, imperfect glass from primitive heat work; cloudy, brittle, and still better than nothing. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
cooking-fire=Forge-world annotation: a controlled thermal onboarding device for meals, rendering, and early morale-neutral processing. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
stone-water-wheel=Forge-world annotation: a primitive aqua-mechanicus-handling upgrade proving operations can improve misery without eliminating it. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
pondering-hovel=Forge-world annotation: an expanded ideation hovel where meals, paperwork, and piscine biomass-noospheric doctrine are converted into authorized bad ideas. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
quarry=Forge-world annotation: a primitive extraction site for persuading uncooperative ground to join the quarterly plan. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
solar-boiler=Forge-world annotation: a solar boiler that bullies aqua-mechanicus into sanctified vapor while avoiding the appearance of fuel dependence. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
fish-pond=A genetor-approved biomass rite: a biological retention pond for protein supply, piscine biomass noospheric doctrine, and wellness-adjacent chemical feedstocks. Flesh remains weak, but occasionally useful as input.
stone-tools=Forge-world annotation: entry-level output benediction implements issued without warranty, training, or replacement policy. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
primitive-steam-powered-pump=Forge-world annotation: a rough sanctified vapor-driven pump that trades elegance for pressure and usually wins. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
steam-condenser=Forge-world annotation: a recovery department for stealing aqua-mechanicus and mineral leftovers back from vapor before Finance notices. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
calcifier=Forge-world annotation: a mineral recovery department with no budget, no ventilation, and suspiciously useful throughput. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
shaler=Forge-world annotation: a effluvia-cracking rite-compliance associate that turns filth into ore and ore into new reporting obligations. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
Steam-Compressor=Forge-world annotation: a pressure-handling middle manager that forces vapor into canisters and calls the consequences stored value. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
Cradinal-grametter=Recovered from dubious STC-adjacent marginalia, a calibration excuse requiring certified paperwork, because measurement without authorization might imply accountability. Recite the litanies before energizing.
Hydrocoptic-marselvanes=Recovered from dubious STC-adjacent marginalia, hydrocoptic vanes calibrated under submitted evaluation so wet-phase nonsense can proceed with documented confidence. Recite the litanies before energizing.
Retro-Encabulator=Recovered from dubious STC-adjacent marginalia, a major Omnissian encabulation rite-compliance core whose impossible machinery arrives pre-laundered through paperwork. Recite the litanies before energizing.
PhaseDetractor=Forge-world annotation: a phase control unit that drags unstable reactions back toward something the factory can survive and the report can abbreviate. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
Canister-waste=By sealed decree of the red-robed priesthood, a sealed industrial externality canister for moving concentrated filth without wearing it. Handle as blessed contamination, not as a mistake.
Canister-Radioactivewaste=By sealed decree of the red-robed priesthood, a sealed radiological asset canister for transport, denial, and later optimistic refining. Handle as blessed contamination, not as a mistake.
Canister=Forge-world annotation: an empty process canister for sanctified vapor, effluvia, and whatever else needs a metal apology. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
Charged-Canister=Forge-world annotation: a sanctified vapor-charged canister carrying pressure, heat, and a small amount of deferred consequence. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
Alumatedplate=Forge-world annotation: alumated plating for Omnissian encabulator frames, armored housings, and shiny procurement forms. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
trace-mineral-slurry=A martial rite of the Forge: waterlogged consecrated clay carrying the first useful traces of seablock mineral capture. The Machine Spirit hungers for calibration and sanctioned violence.
saline-particulate=Forge-world annotation: dried salt grit and suspended mineral fines recovered from crude slurry. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
ionic-scum=Forge-world annotation: a reactive crust of salts, effluvia ions, and all the chemistry nobody wanted to admit worked. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
heavy-brine-fraction=Forge-world annotation: dense brine concentrate separated for shaler-grade mineral extraction. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
microcrystal-sediment=Forge-world annotation: calcified crystalline sediment suitable for stranger downstream processing. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
fish-oil-residue=A genetor-approved biomass rite: rendered piscine biomass oil residue used as a binder, lubricant, and document-adjacent shame medium. Flesh remains weak, but occasionally useful as input.
protein-slurry=A genetor-approved biomass rite: employee wellness expressed as a pumpable biological intermediate. Flesh remains weak, but occasionally useful as input.
calcified-bone-dust=Forge-world annotation: burnt and ground piscine biomass-bone mineral dust for bioceramic processing. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
enzyme-paste=A genetor-approved biomass rite: a crude biological catalyst paste assembled from piscine biomass protein and rendered organics. Flesh remains weak, but occasionally useful as input.
rendered-organics=A genetor-approved biomass rite: sanctified Vapor-rendered biological matter for early industrial chemistry and later HR denial. Flesh remains weak, but occasionally useful as input.
marseline-compound=Forge-world annotation: a questionable mineral-biological compound with enough useful behavior to survive review. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
bioceramic-grit=A genetor-approved biomass rite: hardened biological ceramic grit that gives dubious noospheric doctrine a structural backbone. Flesh remains weak, but occasionally useful as input.
hydrocoptic-crystal=Recovered from dubious STC-adjacent marginalia, aqua-Mechanicus-grown crystal media with suspiciously useful optical and phase properties. Recite the litanies before energizing.
amulite-flakes=Recovered from dubious STC-adjacent marginalia, layered flakes of hydrocoptic and marseline material for precision Omnissian encabulation abuse. Recite the litanies before energizing.
phase-reactive-granules=Forge-world annotation: reactive mineral granules that behave themselves only when supervised. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
oscillated-lubricant=Forge-world annotation: piscine Biomass-derived lubricant stabilized until it can survive Omnissian encabulator-grade vibration and procurement-grade explanation. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
stabilized-brine-gel=Forge-world annotation: heavy brine locked into a gel matrix for controlled processing. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
dielectric-chowder=Forge-world annotation: an electrically useful biological-mineral soup best left undescribed in public-facing materials. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
pre-turbulated-emulsion=Forge-world annotation: a preconditioned emulsion prepared for high-grade turbulation steps. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
viscoelastic-froth=Forge-world annotation: elastic foamed organics and brine gel for flexible Omnissian encabulator substrates. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
executive-marseline-resin=Forge-world annotation: premium marseline resin aggressively overnamed so procurement can approve it without understanding it. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
encabuloy-alloy=Recovered from dubious STC-adjacent marginalia, a purpose-built alloy for Omnissian encabulator frames, phase-tolerant components, and audit-resistant explanations. Recite the litanies before energizing.
hyperphase-matrix=Forge-world annotation: a compact matrix for holding unstable phase-reactive components in alignment and liability at arm’s length. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
retrograde-polymer-sheet=Forge-world annotation: polymer sheeting prepared for retrograde motion, policy reversal, and meetings that should have been emails. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
duplexed-substrate=Forge-world annotation: a two-layer accountability substrate for bringing together the least trustworthy parts of the process. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
tank-assembling-machine=A martial rite of the Forge: a heavy fabrication station where armor, Omnissian encabulation, and enough authorization are assembled into tracked administratum posture. The Machine Spirit hungers for calibration and sanctioned violence.
tank-ammo-assembling-machine=A martial rite of the Forge: an ordnance alignment department where explosives are encouraged to discover their quarterly purpose. The Machine Spirit hungers for calibration and sanctioned violence.
tank-light-chasis-wlsk=A martial rite of the Forge: a light chassis upgrade kit for wilderness survival, armor hardening, and questionable field retrofits. The Machine Spirit hungers for calibration and sanctioned violence.
Encabulator=Recovered from dubious STC-adjacent marginalia, a baseline permission engine authorized by audit-survivable deliverables and just enough institutional denial to run. Recite the litanies before energizing.
TurboEncabulator=Recovered from dubious STC-adjacent marginalia, an accelerated Omnissian encabulator case for operators with munitorum stakeholder approval and insufficient caution. Recite the litanies before energizing.
HyperEncabulator=Recovered from dubious STC-adjacent marginalia, a high-order liability core whose operating theory is mostly containment language with moving parts. Recite the litanies before energizing.
FramulatedEncabulator=Recovered from dubious STC-adjacent marginalia, a composite framulated module produced only after board-adjacent paperwork says the risk has become strategic. Recite the litanies before energizing.
tank-ammo-casing=A martial rite of the Forge: a heavy ordnance casing ready to receive explosive filler, bad intentions, and a comforting serial number. The Machine Spirit hungers for calibration and sanctioned violence.
tank-ammo-reinforced-casing=A martial rite of the Forge: a reinforced casing for munitions expected to survive handling, transport, review, and then ruin someone else’s day. The Machine Spirit hungers for calibration and sanctioned violence.
tank-ammo-Industrialwaste=By sealed decree of the red-robed priesthood, industrial effluvia concentrated enough to become a circularity input after Sustainability removes the ugly verbs. Handle as blessed contamination, not as a mistake.
tank-ammo-Radioactivewaste=By sealed decree of the red-robed priesthood, radioactive effluvia awaiting containment, refinement, or a sufficiently optimistic magisterial summary. Handle as blessed contamination, not as a mistake.
tank-ammo-universal-explosive=A martial rite of the Forge: a universal disagreement charge for heavy ammunition and industrial-scale message discipline. The Machine Spirit hungers for calibration and sanctioned violence.
land-mine-poison=A martial rite of the Forge: a chemical munitorum stakeholder notification buried denial relic with delayed environmental feedback. The Machine Spirit hungers for calibration and sanctioned violence.
Seared-fish=A genetor-approved biomass rite: cooked piscine biomass suitable for crude noospheric doctrine, field meals, and morale damage. Flesh remains weak, but occasionally useful as input.
meal=A genetor-approved biomass rite: a caloric rite-compliance unit proving that food can be both necessary and administratively weaponized. Flesh remains weak, but occasionally useful as input.
wood-spear=Forge-world annotation: a pointed onboarding instrument for protein acquisition, perimeter negotiation, and morale correction. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
Sharp-stick=Forge-world annotation: sharpened stick ammunition for when metallurgy has not yet joined the conversation. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
fish-kit=A genetor-approved biomass rite: a compact field wellness kit assembled around piscine biomass, survival, and stubborn logistics. Flesh remains weak, but occasionally useful as input.
hydrolyzed-suspension=Forge-world annotation: a wet mineral suspension beaten out of saline grit, lithic mass, and ore until it begins acting like a feedstock instead of a problem. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
phase-diluted-brine=Forge-world annotation: a diluted brine phase stretched with ore fines and enough structure to keep the reaction from immediately disgracing itself. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
osmotic-residue=Forge-world annotation: pressure-stressed residue left behind when the brine chemistry gives up something useful and one small effluvia stream. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
gradient-saline-matrix=Forge-world annotation: a glassy saline matrix with copper-rich gradients for early hydrocoptic alignment work. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
biphasic-brine-gel=Forge-world annotation: a two-phase brine gel reinforced with iron and kiln-blessed brick so it can be moved before it changes its mind. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
salinity-locked-emulsion=Forge-world annotation: a locked saline emulsion stabilized with copper, glass, and just enough confidence to enter the Omnissian encabulation chain. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
hydrocoptic-precursor=Recovered from dubious STC-adjacent marginalia, a heavy wet-phase precursor for hydrocoptic components, built from brine gels, emulsion, metal, and bad terminology. Recite the litanies before energizing.
denatured-organic-base=Forge-world annotation: piscine Biomass-derived organics denatured into a stable base material for bio-reactive manufacturing. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
enzyme-saturated-mass=A genetor-approved biomass rite: organic mass saturated with crude enzyme paste until it becomes chemically persuasive. Flesh remains weak, but occasionally useful as input.
lipid-carrier-gel=Forge-world annotation: a piscine biomass-oil carrier gel for hauling reactive organic chemistry through the process without asking too many questions. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
bio-reactive-slurry=A genetor-approved biomass rite: a copper-bearing biological slurry that reacts usefully, messily, and preferably inside the machine. Flesh remains weak, but occasionally useful as input.
catalytic-organic-medium=Forge-world annotation: a catalytic organic medium prepared to make later reactions faster and procurement language worse. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
reactive-enzyme-binder=A genetor-approved biomass rite: a metal-reinforced enzyme binder for holding unstable bio-reactive inputs in temporary cooperation. Flesh remains weak, but occasionally useful as input.
bio-synthetic-precursor=A genetor-approved biomass rite: a dense bio-synthetic precursor where organic chemistry starts wearing mechanical hardware. Flesh remains weak, but occasionally useful as input.
crystalline-agglomerate=Forge-world annotation: a rough agglomerate of microcrystals, bone minerals, and lithic mass prepared for lattice abuse. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
fractured-lattice-mass=Forge-world annotation: a deliberately fractured lattice mass that exposes more useful surface area and fewer comforting answers. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
ceramic-seed-grain=Forge-world annotation: seed ceramic grains for growing stronger mineral lattices in the next round of questionable processing. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
mineral-phase-fragments=A martial rite of the Forge: phase-marked mineral fragments carrying enough iron, copper, and crystalline structure to become interesting. The Machine Spirit hungers for calibration and sanctioned violence.
ceramic-lattice-core=Forge-world annotation: a ceramic lattice core reinforced with plate and stick stock for preform-grade mineral structure. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
compressed-crystal-bed=Forge-world annotation: a compressed crystal bed forced into alignment with lithic mass, copper, and gears because subtlety was unavailable. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
bioceramic-preform=A genetor-approved biomass rite: a dense bioceramic preform ready to become part of something much more expensive and much less reasonable. Flesh remains weak, but occasionally useful as input.
charged-ionic-matrix=Forge-world annotation: an ion-charged matrix built from scum, ore, and copper for early electrical phase handling. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
dielectric-suspension=Forge-world annotation: a suspended dielectric medium carrying copper cable and ionic charge in a form nobody should drink. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
conductive-residue=Forge-world annotation: conductive residue recovered and reinforced for phase work where normal wiring would file a complaint. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
phase-unstable-granulate=Forge-world annotation: a granular phase material that is useful precisely because it has not decided what state it prefers. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
balanced-reactive-medium=Forge-world annotation: a balanced reactive medium that forces conductive and dielectric inputs into the same committee meeting. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
phase-primed-carrier=Forge-world annotation: a phase-primed carrier for moving unstable charge through later Omnissian encabulation steps without immediate theatrics. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
electro-phase-precursor=Forge-world annotation: a dense electro-phase precursor combining balanced media and phase carriers into the final pre-Omnissian encabulation bridge. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
charcoal=Forge-world annotation: burned lignum converted into a darker, less accountable form of fuel, ink, and documentation residue. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
wood-pulp=Forge-world annotation: useful timber reduced into damp administrative substrate for the slow murder of output benediction. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
crude-paper=Administratum canticle: the first surface capable of holding blame in a legible format. Without the seal, the rite is invalid; without the rite, the machine sulks.
ink=Forge-world annotation: piscine Biomass-oil and charcoal blame-assignment fluid for converting decisions into evidence. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
staples=Forge-world annotation: tiny metal prongs that attach documents to one another while detaching them from reality. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
stamps=Forge-world annotation: reusable approval devices for making procedural theater faster and more repeatable. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
folder=Forge-world annotation: a parchment concealment device that improves the audit survivability of incomplete decisions. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
clipboard=Forge-world annotation: a portable oversight amplifier; holding it increases the apparent legitimacy of standing near a problem. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
requisition-slip=Administratum canticle: a preliminary resource desire formatted for denial, escalation, or accidental approval. Without the seal, the rite is invalid; without the rite, the machine sulks.
work-order-slip=Administratum canticle: a requisition that survived long enough to become somebody else’s problem. Without the seal, the rite is invalid; without the rite, the machine sulks.
certified-work-order=Administratum canticle: a liturgical work mandate with enough procedural mass to damage small machinery. Without the seal, the rite is invalid; without the rite, the machine sulks.
submitted-evaluation=Forge-world annotation: a document confirming that a thing was looked at by someone near responsibility. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
risk-assessment=Administratum canticle: a formal declaration that danger has been observed, named, and left mostly intact. Without the seal, the rite is invalid; without the rite, the machine sulks.
risk-assessed-work-order=Administratum canticle: a liturgical work mandate rendered safe through documentation, not intervention. Without the seal, the rite is invalid; without the rite, the machine sulks.
corporate-waste=By sealed decree of the red-robed priesthood, administrative failure residue: too documented to ignore, too worthless to respect, and somehow recyclable. Handle as blessed contamination, not as a mistake.
compliance-packet=Administratum canticle: a packet of risk, paperwork, and technically related material acceptable to people who will never open it. Without the seal, the rite is invalid; without the rite, the machine sulks.
audit-ready-deliverable=Administratum canticle: a deliverable engineered not to explain the process, but to survive proximity to auditors. Without the seal, the rite is invalid; without the rite, the machine sulks.
stakeholder-review-summary=Administratum canticle: operational reality condensed into a format compatible with investor optimism. Without the seal, the rite is invalid; without the rite, the machine sulks.
liability-contained-report=Administratum canticle: a report vessel engineered to keep liability inside the document and outside the room. Without the seal, the rite is invalid; without the rite, the machine sulks.
board-review-docket=Administratum canticle: a bound mass of pre-decided outcomes prepared for magisterial witnessing. Without the seal, the rite is invalid; without the rite, the machine sulks.
board-advisory-risk-assessment=Administratum canticle: the final magisterial relic proving that catastrophic risk has been blessed, distributed, and made non-actionable. Without the seal, the rite is invalid; without the rite, the machine sulks.
SpervingArm=Recovered from dubious STC-adjacent marginalia, a first efficiency module whose reduced consumption has been formally described as savings. Recite the litanies before energizing.
DuctedSpervingArm=Recovered from dubious STC-adjacent marginalia, an improved sperving arm with ducted process control and a munitorum stakeholder-reviewed excuse for existing. Recite the litanies before energizing.
DuplexedSpervingArm=Recovered from dubious STC-adjacent marginalia, a duplexed sperving arm that saves power while increasing the density of required approvals. Recite the litanies before energizing.

compressed-biohazard-waste=By sealed decree of the red-robed priesthood, a compact puck of hazardous material reclassified as a logistics opportunity because disposal sounded too negative. Handle as blessed contamination, not as a mistake.


