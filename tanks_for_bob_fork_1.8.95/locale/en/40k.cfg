[tfbf-40k-recipe-description]
campfire=Forge-world annotation: assembles a basic campfire from lignum, producing the first controllable heat source on the island. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
beachpump=Forge-world annotation: builds a crude beach pump for pulling seawater into the rest of the survival chain. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
wood-basin=Forge-world annotation: builds a wooden basin for crude settling, washing, and wet-process handling. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
shaler1=Forge-world annotation: feeds profane industrial effluvia and sanctified vapor through the shaler to recover the first scraps of iron ore. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
shalera=Forge-world annotation: loads loose profane industrial effluvia into a canister so it can be moved without decorating the operator. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
shalerb=Forge-world annotation: empties an profane industrial effluvia canister back into loose process effluvia. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
shalerc=Forge-world annotation: loads radiant atomantic sin into a sealed canister for safer handling and later abuse. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
shaler3=Forge-world annotation: decants a radiant atomantic sin canister back into processable radiant atomantic sin. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
Calcifier-pro-2=Forge-world annotation: washes lithic mass and aqua-mechanicus through an improved calcifier cycle, multiplying rock and shedding dirty byproduct. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
Calcifier-pro-3=Forge-world annotation: pushes a heavier wet-lithic mass load through the calcifier for larger mineral recovery. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
Calcifier-pro-4=Forge-world annotation: uses sanctified vapor heat to accelerate calcification and produce a more serious effluvia stream. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
Calcifier-pro-5=Forge-world annotation: runs industrial-scale sanctified vapor calcification for bulk lithic mass recovery and generous industrial filth. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
shaler2=Forge-world annotation: converts profane industrial effluvia and sanctified vapor into a mixed iron and copper ore recovery stream. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
shaler4=Forge-world annotation: runs a hotter shaler pass that pulls ore from effluvia while beginning radioactive contamination. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
shaler5=Forge-world annotation: processes a heavy profane industrial effluvia charge for bulk ore and stronger radioactive residue. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
shaler6=Forge-world annotation: runs mass effluvia shaling at full ugly throughput, producing ore by the cartload and effluvia by the warning label. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
radio-refine-2=Forge-world annotation: refines radiant atomantic sin into uranium ore with a small sulfuric acid recovery stream. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
radio-refine-3=Forge-world annotation: refines a larger radioactive batch into uranium ore and useful acid byproduct. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
radio-refine-4=Forge-world annotation: runs industrial radioactive refining for serious uranium recovery. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
radio-refine-5=Forge-world annotation: mass-refines radiant atomantic sin into uranium and acid at a scale that deserves a fenced perimeter. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
Steam-Charge=Forge-world annotation: uses sanctified vapor and effluvia heat to squeeze another iron-bearing scrap out of the shaler line. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
Steam-condenserA=Forge-world annotation: condenses sanctified vapor through lignum and primitive filtration to recover lithic mass and dirty residue. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
workbench=Forge-world annotation: builds the first proper workbench, where handcrafting starts wearing a tie. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
workbenchA=Forge-world annotation: assembles a sturdier workbench from iron plate when woodcraft is no longer enough. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
thinking-hut=Forge-world annotation: builds a thinking hut for early research and increasingly dangerous ideas. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
clay-pit=Forge-world annotation: builds a consecrated clay pit for organized mud extraction. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
pit-kiln=Forge-world annotation: combines a consecrated clay pit and campfire into a primitive kiln for fired materials. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
growing-plot=Forge-world annotation: builds a growing plot for renewable lignum and early biological recovery. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
stone=Forge-world annotation: quarries loose lithic mass by hand from whatever ground the sea has not stolen yet. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
Trees=Forge-world annotation: cultivates trees from the growing plot line for lignum, fuel, and structural desperation. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
harvest-fish=A genetor-approved biomass rite: harvests piscine biomass from controlled aqua-mechanicus access for food and biological inputs. Flesh remains weak, but occasionally useful as input.
catch-fish=A genetor-approved biomass rite: uses a simple wooden rig to catch piscine biomass faster than dignity would recommend. Flesh remains weak, but occasionally useful as input.
Seared-fish=A genetor-approved biomass rite: cooks raw piscine biomass over lignum into something scientifically useful and nutritionally negotiable. Flesh remains weak, but occasionally useful as input.
clay=Forge-world annotation: mixes lithic mass, aqua-mechanicus, and shoreline muck into usable consecrated clay. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
brick=Forge-world annotation: fires consecrated clay into kiln-blessed brick using the pit kiln. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
crude-glass=Forge-world annotation: burns fuel hot enough to produce rough glass for primitive apparatus. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
wood-spear=Forge-world annotation: shapes lignum into a spear for early defense and piscine biomass-related aggression. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
Sharp-stick=Forge-world annotation: cuts lignum into sharpened stick ammunition. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
cooking-fire=Forge-world annotation: builds a more controlled cooking fire from kiln-blessed brick and an existing campfire. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
stone-water-wheel=Forge-world annotation: builds a lithic mass aqua-mechanicus wheel for the first mechanical power experiments. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
pondering-hovel=Forge-world annotation: upgrades the thinking hut into a sturdier pondering hovel. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
quarry=Forge-world annotation: builds a quarry for repeatable lithic mass and ore extraction. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
solar-boiler=Forge-world annotation: builds a solar boiler to raise sanctified vapor without feeding it burnable fuel. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
fish-pond=A genetor-approved biomass rite: builds a piscine biomass pond to stabilize food and biological feedstock supply. Flesh remains weak, but occasionally useful as input.
meal=A genetor-approved biomass rite: prepares seared piscine biomass into a more useful research ration. Flesh remains weak, but occasionally useful as input.
steam-meal=A genetor-approved biomass rite: sanctified Vapor-cooks piscine biomass into bulk meals with less charm and better throughput. Flesh remains weak, but occasionally useful as input.
stone-tools=Forge-world annotation: makes crude lithic mass tools from lithic mass and lignum. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
stone-tools-iron=Forge-world annotation: improves lithic mass tool production using iron sticks and lithic mass kiln-blessed brick. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
Canister=Forge-world annotation: forges rough canisters from lithic mass tools and ore. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
Charged-Canister=Forge-world annotation: compresses sanctified vapor into a canister for portable stored pressure. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
UnCharge-Canister=Forge-world annotation: vents a charged canister back into usable sanctified vapor and an empty munition rite. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
primitive-steam-powered-pump=Forge-world annotation: builds a sanctified vapor-powered pump from kiln-blessed brick and lignum. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
steam-condenser=Forge-world annotation: builds a sanctified vapor condenser from crude glass and kiln-blessed brick. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
calcifier=Forge-world annotation: builds a calcifier for mineral recovery and scaling operations. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
Calcifier-pro=Forge-world annotation: runs the basic calcifier cycle to turn wet lithic mass feedstock into more lithic mass. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
shaler=Forge-world annotation: builds the shaler machine for effluvia cracking and ore recovery. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
Steam-Compressor=Forge-world annotation: builds a sanctified vapor compressor from a shaler and cooking fires. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
quarry-iron-ore=Forge-world annotation: uses lithic mass tools and kiln-blessed brick to quarry iron ore from rough ground. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
quarry-copper-ore=Forge-world annotation: uses lithic mass tools and kiln-blessed brick to quarry copper ore from rough ground. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
quarry-iron-orea=Forge-world annotation: quarries iron ore with improved lithic mass kiln-blessed brick support. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
quarry-copper-oreb=Forge-world annotation: quarries copper ore with improved lithic mass kiln-blessed brick support. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
trace-mineral-slurry=A martial rite of the Forge: suspends consecrated clay in seawater to capture the first trace minerals. The Machine Spirit hungers for calibration and sanctioned violence.
saline-particulate=Forge-world annotation: dries trace slurry into salt grit and mineral particulates. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
ionic-scum=Forge-world annotation: calcifies saline particulate into a reactive ion-rich crust and a little effluvia. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
heavy-brine-fraction=Forge-world annotation: sanctified Vapor-separates saline particulate into a dense brine fraction. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
microcrystal-sediment=Forge-world annotation: calcifies heavy brine with lithic mass into microcrystalline sediment. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
fish-oil-residue=A genetor-approved biomass rite: renders raw piscine biomass into oily residue for early biochemical work. Flesh remains weak, but occasionally useful as input.
protein-slurry=A genetor-approved biomass rite: macerates piscine biomass and aqua-mechanicus into protein slurry. Flesh remains weak, but occasionally useful as input.
calcified-bone-dust=Forge-world annotation: burns piscine biomass remains into mineral-rich bone dust. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
enzyme-paste=A genetor-approved biomass rite: combines protein slurry and rendered organics into a crude catalyst paste. Flesh remains weak, but occasionally useful as input.
rendered-organics=A genetor-approved biomass rite: sanctified Vapor-renders piscine biomass into organic feedstock and bonus oil residue. Flesh remains weak, but occasionally useful as input.
marseline-compound=Forge-world annotation: blends mineral slurry, saline particulate, and enzyme paste into marseline compound. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
bioceramic-grit=A genetor-approved biomass rite: fires bone dust into hard bioceramic grit. Flesh remains weak, but occasionally useful as input.
hydrocoptic-crystal=Recovered from dubious STC-adjacent marginalia, grows hydrocoptic crystals from sediment, glass, and aqua-mechanicus. Recite the litanies before energizing.
amulite-flakes=Recovered from dubious STC-adjacent marginalia, shales marseline compound and hydrocoptic crystal into amulite flakes. Recite the litanies before energizing.
phase-reactive-granules=Forge-world annotation: combines ionic scum, bioceramic grit, and copper into reactive granules. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
oscillated-lubricant=Forge-world annotation: stabilizes piscine biomass oil with ionic scum into vibration-tolerant lubricant. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
stabilized-brine-gel=Forge-world annotation: binds heavy brine with enzyme paste into a controllable gel. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
dielectric-chowder=Forge-world annotation: mixes protein slurry, bioceramic grit, and copper cable into a dielectric slurry. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
pre-turbulated-emulsion=Forge-world annotation: combines lubricant, brine gel, and reactive granules into pre-turbulated emulsion. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
viscoelastic-froth=Forge-world annotation: foams rendered organics, brine gel, and glass into flexible froth. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
executive-marseline-resin=Forge-world annotation: upgrades marseline compound with lubricant and amulite into high-grade resin. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
encabuloy-alloy=Recovered from dubious STC-adjacent marginalia, alloys plates, crystal, and bioceramic grit into encabuloy stock. Recite the litanies before energizing.
hyperphase-matrix=Forge-world annotation: locks reactive granules, dielectric chowder, and circuitry into a hyperphase matrix. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
retrograde-polymer-sheet=Forge-world annotation: forms resin, froth, and circuits into retrograde polymer sheet. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
duplexed-substrate=Forge-world annotation: laminates alloy and polymer sheet into a duplexed Omnissian encabulator substrate. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
Hydrocoptic-marselvanes=Recovered from dubious STC-adjacent marginalia, assembles hydrocoptic marselvanes for wet-phase Omnissian encabulator alignment. Recite the litanies before energizing.
PhaseDetractor=Forge-world annotation: assembles a phase detractor for keeping unstable reactions on a shorter leash. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
Alumatedplate=Forge-world annotation: produces alumated plate for hardening Omnissian encabulator and vehicle components. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
Encabulator=Recovered from dubious STC-adjacent marginalia, assembles the baseline Omnissian encabulator from exotic components and poor institutional restraint. Recite the litanies before energizing.
DuctedSpervingArm=Recovered from dubious STC-adjacent marginalia, ducts a sperving arm for cleaner movement of exactly the wrong energies. Recite the litanies before energizing.
TurboEncabulator=Recovered from dubious STC-adjacent marginalia, upgrades Omnissian encabulation into a faster, louder, more expensive failure mode. Recite the litanies before energizing.
Retro-Encabulator=Recovered from dubious STC-adjacent marginalia, assembles a retro Omnissian encabulator stage for reverse-coupled phase handling. Recite the litanies before energizing.
HyperEncabulator=Recovered from dubious STC-adjacent marginalia, builds the hyper Omnissian encabulator, where the process stops asking permission. Recite the litanies before energizing.
FramulatedEncabulator=Recovered from dubious STC-adjacent marginalia, framulates the Omnissian encabulator chassis so the impossible parts stay bolted down. Recite the litanies before energizing.
Cradinal-grametter=Recovered from dubious STC-adjacent marginalia, builds a cradinal grametter for measuring what no responsible engineer named. Recite the litanies before energizing.
tank-ammo-assembling-machine=A martial rite of the Forge: builds a dedicated ammunition assembly machine for heavy ordnance work. The Machine Spirit hungers for calibration and sanctioned violence.
tank-light-chasis-wlsk=A martial rite of the Forge: assembles a WLSK light chassis upgrade kit for field survival and armor improvements. The Machine Spirit hungers for calibration and sanctioned violence.
tank-ammo-universal-explosive=A martial rite of the Forge: packs a universal explosive filler for heavy battle-crawler ammunition. The Machine Spirit hungers for calibration and sanctioned violence.
tank-ammo-universal-explosive-synthetic=A martial rite of the Forge: synthesizes universal explosive filler from less convenient feedstocks. The Machine Spirit hungers for calibration and sanctioned violence.
tank-ammo-explosive-synthetic=A martial rite of the Forge: derives explosive compounds from synthetic organic chemistry. The Machine Spirit hungers for calibration and sanctioned violence.
tank-ammo-industrial-coke=A martial rite of the Forge: processes industrial coke for ammunition chemistry and heavy manufacturing. The Machine Spirit hungers for calibration and sanctioned violence.
tank-ammo-Reprocessing=A martial rite of the Forge: reprocesses radiant atomantic sin into usable military-industrial materials. The Machine Spirit hungers for calibration and sanctioned violence.
tank-ammo-Explosive-Engineering=A martial rite of the Forge: research-grade explosive engineering disguised as a production rite. The Machine Spirit hungers for calibration and sanctioned violence.
Rubberized-timber=Forge-world annotation: treats timber into a flexible structural material for crude mechanical builds. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
tank-ammo-ecozone=A martial rite of the Forge: processes the so-called ecozone path for alternative explosive inputs. The Machine Spirit hungers for calibration and sanctioned violence.
tank-ammo-casing=A martial rite of the Forge: forms heavy ammunition casings for battle-crawler ordnance. The Machine Spirit hungers for calibration and sanctioned violence.
tank-ammo-reinforced-casing=A martial rite of the Forge: reinforces ammunition casings for larger charges and worse ideas. The Machine Spirit hungers for calibration and sanctioned violence.
ore-from-waste=By sealed decree of the red-robed priesthood, extracts usable ore from profane industrial effluvia through low-grade reprocessing. Handle as blessed contamination, not as a mistake.
ore-from-wasteb=By sealed decree of the red-robed priesthood, runs an alternate effluvia-to-ore recovery route. Handle as blessed contamination, not as a mistake.
ore-from-waster=By sealed decree of the red-robed priesthood, processes radiant atomantic sin into ore-bearing residue. Handle as blessed contamination, not as a mistake.
land-mine-poison=A martial rite of the Forge: assembles a chemical land buried denial relic for area denial. The Machine Spirit hungers for calibration and sanctioned violence.
fish-kit=A genetor-approved biomass rite: packs a piscine biomass kit for field recovery, noospheric doctrine, and improvised survival logistics. Flesh remains weak, but occasionally useful as input.
Trees-with-tools=Forge-world annotation: uses lithic mass tools to improve tree harvesting, returning the tools while producing a better lignum yield. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
stone-with-tools=Forge-world annotation: uses lithic mass tools to quarry more lithic mass from the same miserable ground, with the tools returned for further punishment. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
catch-fish-with-tools=A genetor-approved biomass rite: uses lignum and lithic mass tools to catch a larger piscine biomass yield while keeping the tools in service. Flesh remains weak, but occasionally useful as input.
clay-with-tools=Forge-world annotation: works lithic mass, aqua-mechanicus, and lithic mass tools into a larger consecrated clay batch without consuming the tools. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
hand-chip-iron-ore=Forge-world annotation: chips one iron ore out of lithic mass by hand, for emergencies where pride has already left the island. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
hand-scrape-wood=Forge-world annotation: scrapes a single unit of lignum out of lithic mass-tool labor, a fallback rite with the efficiency of a punishment detail. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
hand-break-fish-for-stone=A genetor-approved biomass rite: breaks down piscine biomass with lithic mass tools into a desperate lithic mass recovery route that raises several biological questions. Flesh remains weak, but occasionally useful as input.
hydrolyzed-suspension=Forge-world annotation: hydrolyzes saline particulate and trace slurry with lithic mass, ore, copper, and lignum into the first pre-Omnissian encabulation wet feedstock. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
phase-diluted-brine=Forge-world annotation: dilutes hydrolyzed suspension with ore, lithic mass, and lignum into a brine phase stable enough for follow-on handling. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
osmotic-residue=Forge-world annotation: presses hydrolyzed suspension through lithic mass, kiln-blessed brick, and ore into osmotic residue while producing profane industrial effluvia. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
gradient-saline-matrix=Forge-world annotation: builds a copper-gradient saline matrix around crude glass and hydrolyzed suspension. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
biphasic-brine-gel=Forge-world annotation: combines phase-diluted brine and osmotic residue with iron reinforcement into a two-phase brine gel. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
salinity-locked-emulsion=Forge-world annotation: locks gradient saline matrix and osmotic residue into a copper-and-glass emulsion. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
hydrocoptic-precursor=Recovered from dubious STC-adjacent marginalia, combines brine gel, locked emulsion, gears, plates, glass, and lithic mass into a hydrocoptic precursor. Recite the litanies before energizing.
denatured-organic-base=Forge-world annotation: denatures protein slurry and rendered organics with lignum, lithic mass, and ore into a stable organic base. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
enzyme-saturated-mass=A genetor-approved biomass rite: saturates denatured organic base with enzyme paste and crude hardware into enzyme-bearing mass. Flesh remains weak, but occasionally useful as input.
lipid-carrier-gel=Forge-world annotation: binds denatured organics and piscine biomass oil into a lipid gel with enough mineral support to travel downstream. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
bio-reactive-slurry=A genetor-approved biomass rite: combines denatured organic base, piscine biomass oil, and copper feedstock into a reactive biological slurry. Flesh remains weak, but occasionally useful as input.
catalytic-organic-medium=Forge-world annotation: blends enzyme-saturated mass and lipid carrier gel with cable, kiln-blessed brick, and iron into a catalytic organic medium. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
reactive-enzyme-binder=A genetor-approved biomass rite: reinforces bio-reactive slurry and enzyme-saturated mass into a binder for unstable organic components. Flesh remains weak, but occasionally useful as input.
bio-synthetic-precursor=A genetor-approved biomass rite: merges catalytic medium and enzyme binder with gears, plates, cable, lignum, and kiln-blessed brick into a bio-synthetic precursor. Flesh remains weak, but occasionally useful as input.
crystalline-agglomerate=Forge-world annotation: combines microcrystal sediment and bone dust with lithic mass, kiln-blessed brick, and ore into a rough crystalline agglomerate. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
fractured-lattice-mass=Forge-world annotation: breaks crystalline agglomerate into a fractured lattice mass reinforced with mixed ore. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
ceramic-seed-grain=Forge-world annotation: seeds crystalline agglomerate into ceramic grain using kiln-blessed brick, lithic mass, and iron stick structure. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
mineral-phase-fragments=A martial rite of the Forge: splits crystalline agglomerate into mineral phase fragments with mixed ore and kiln-blessed brick support. The Machine Spirit hungers for calibration and sanctioned violence.
ceramic-lattice-core=Forge-world annotation: combines fractured lattice mass and ceramic seed grain into a reinforced ceramic lattice core. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
compressed-crystal-bed=Forge-world annotation: compresses mineral phase fragments and fractured lattice mass into a crystal bed with copper and gear alignment. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
bioceramic-preform=A genetor-approved biomass rite: fuses ceramic lattice cores and compressed crystal beds into a dense bioceramic preform. Flesh remains weak, but occasionally useful as input.
charged-ionic-matrix=Forge-world annotation: charges ionic scum with copper and mixed ore into an electrical phase matrix. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
dielectric-suspension=Forge-world annotation: suspends charged ionic matrix through copper cable and metal support into a dielectric medium. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
conductive-residue=Forge-world annotation: processes charged ionic matrix with iron and copper plate into conductive residue. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
phase-unstable-granulate=Forge-world annotation: combines charged ionic matrix and saline particulate into unstable granulate for phase-reactive handling. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
balanced-reactive-medium=Forge-world annotation: balances dielectric suspension and conductive residue into a reactive medium with gears, cable, and plate stock. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
phase-primed-carrier=Forge-world annotation: primes unstable granulate and dielectric suspension into a phase carrier for later Omnissian encabulation steps. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
electro-phase-precursor=Forge-world annotation: combines balanced reactive medium and phase-primed carrier into the electro-phase bridge before higher Omnissian encabulation. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
tank-assembling-machine=A martial rite of the Forge: assembles a dedicated battle-crawler factory for turning heavy components into tracked business decisions. The Machine Spirit hungers for calibration and sanctioned violence.
desperation-gather-fish=A genetor-approved biomass rite: a terrible hand fallback for collecting one piscine biomass when the island has not yet agreed to support life. Flesh remains weak, but occasionally useful as input.
desperation-scrape-driftwood=Forge-world annotation: a miserable hand fallback for scraping one usable piece of lignum out of the shoreline. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
desperation-pick-stone=Forge-world annotation: a slow hand fallback for prying one lithic mass from the world by spite alone. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
desperation-landfill=Forge-world annotation: turns a painful pile of lithic mass into one more patch of ground to stand on. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
charcoal=Forge-world annotation: burns lignum down into accountability charcoal for fuel, ink, and the first dirty fingerprints of bureaucracy. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
wood-pulp=Forge-world annotation: reduces lignum and aqua-mechanicus into administrative pulp suitable for forms, folders, and the slow murder of useful timber. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
crude-paper=Administratum canticle: presses pulp and charcoal into the first surface capable of holding blame in a legible format. Without the seal, the rite is invalid; without the rite, the machine sulks.
ink=Forge-world annotation: combines charcoal, piscine biomass oil, and aqua-mechanicus into formalized blame-assignment fluid. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
staples=Forge-world annotation: cuts crude metal fasteners so documents can remain attached to one another and detached from reality. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
stamps=Forge-world annotation: builds reusable approval devices from lignum, glass, and ink for faster procedural theater. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
folder=Forge-world annotation: turns parchment and pulp into a concealment device that improves audit survivability. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
clipboard=Forge-world annotation: creates a portable oversight amplifier for looking legitimate near unresolved problems. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
requisition-slip=Administratum canticle: creates a resource desire intake slip from crude parchment, ink, and piscine biomass oil residue. Without the seal, the rite is invalid; without the rite, the machine sulks.
work-order-slip=Administratum canticle: escalates requisitions into work orders with nutrient rite, ink, staples, and a generous failure path into administrative residue. Without the seal, the rite is invalid; without the rite, the machine sulks.
certified-work-order=Administratum canticle: consumes work orders, mineral slurry, piscine biomass noospheric doctrine, stamps, and staples to produce certified authority with lossy effluvia. Without the seal, the rite is invalid; without the rite, the machine sulks.
submitted-evaluation=Forge-world annotation: packages certified work into a submitted evaluation using crude glass, piscine biomass residue, clipboard handling, and more staples. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
risk-assessment=Administratum canticle: transforms submitted evaluation mass into named risk recognition while leaving most of the risk where it was. Without the seal, the rite is invalid; without the rite, the machine sulks.
risk-assessed-work-order=Administratum canticle: binds risk assessments into a foldered liturgical work mandate that claims risk has been addressed. Without the seal, the rite is invalid; without the rite, the machine sulks.
corporate-waste-reprocessing=By sealed decree of the red-robed priesthood, recovers a fraction of administrative substrate from failed approvals while preserving the full spiritual toxicity of the process. Handle as blessed contamination, not as a mistake.
decompose-certified-work-order=Administratum canticle: invalidates certified authority into recyclable fragments after discovering the approval was issued by the wrong desk. Without the seal, the rite is invalid; without the rite, the machine sulks.
decompose-submitted-evaluation=Forge-world annotation: returns an evaluation to component documents once everyone agrees it was submitted too close to responsibility. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
decompose-risk-assessed-work-order=Administratum canticle: recovers paperwork from a risk-assessed liturgical work mandate without recovering any actual safety. Without the seal, the rite is invalid; without the rite, the machine sulks.
decompose-audit-ready-deliverable=Administratum canticle: dismantles audit readiness into reusable rite-compliance fragments and one quiet organizational shame event. Without the seal, the rite is invalid; without the rite, the machine sulks.
compliance-packet=Administratum canticle: combines risk, paperwork, and technically related materials into a packet acceptable to people who will never open it. Without the seal, the rite is invalid; without the rite, the machine sulks.
audit-ready-deliverable=Administratum canticle: prepares materials to survive external review by making them dense, expensive, and unpleasant to question. Without the seal, the rite is invalid; without the rite, the machine sulks.
stakeholder-review-summary=Administratum canticle: summarizes operational reality into a format compatible with investor optimism. Without the seal, the rite is invalid; without the rite, the machine sulks.
liability-contained-report=Administratum canticle: cans munitorum stakeholder review into a report vessel engineered to keep liability inside the document and outside the room. Without the seal, the rite is invalid; without the rite, the machine sulks.
board-review-docket=Administratum canticle: assembles reports, hyperphase material, polymer sheets, and stamps into a board-facing docket of pre-decided outcomes. Without the seal, the rite is invalid; without the rite, the machine sulks.
board-advisory-risk-assessment=Administratum canticle: consumes the board docket, top Omnissian encabulator modules, radiant atomantic sin, and liability reports to produce final strategic permission. Without the seal, the rite is invalid; without the rite, the machine sulks.

industrial-waste-to-toxic-sludge=By sealed decree of the red-robed priesthood, reclassifies profane industrial effluvia as a pumpable circularity asset pending remote combustion. Handle as blessed contamination, not as a mistake.
radioactive-waste-to-toxic-sludge=By sealed decree of the red-robed priesthood, improves radiant atomantic sin optics by making it harder to point at individually. Handle as blessed contamination, not as a mistake.
corporate-waste-to-toxic-sludge=By sealed decree of the red-robed priesthood, liquefies failed documentation into a toxic administrative slurry suitable for relocation away from anyone authorized to complain. Handle as blessed contamination, not as a mistake.
compress-toxic-sludge=By sealed decree of the red-robed priesthood, converts distributed liability into a compact burnable biohazard opportunity. This is not remediation. This is logistics. Handle as blessed contamination, not as a mistake.


