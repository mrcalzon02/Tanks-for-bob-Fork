[tfbf-40k-fluid-description]
toxic-sludge=By sealed decree of the red-robed priesthood, a transportable legal, biological, chemical, and administrative failure medium. Technically contained. Spiritually loose. Excellent for moving the problem somewhere quieter. Handle as blessed contamination, not as a mistake.


[tfbf-40k-technology-description]
toxic-sludge-condensation=By sealed decree of the red-robed priesthood, unlocks the conversion of industrial, radioactive, and administratum effluvia into multiphase liability suspension, allowing hazardous responsibility to travel by pipe before becoming a compact burnable biohazard opportunity. Handle as blessed contamination, not as a mistake.

Steam-Compressor=Forge-world annotation: completes the primitive seablock exit by joining aqua-mechanicus, consecrated clay, piscine biomass, and quarry infrastructure into sanctified vapor compression and pressure handling. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
stone-tools-iron=Forge-world annotation: improves primitive tool production by adding iron reinforcement to the lithic mass-and-kiln-blessed brick tooling line. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
campfire=Forge-world annotation: establishes the approved combustion zone for early warmth, cooking, and visible evidence of effort. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
beachpump=Forge-world annotation: authorizes shoreline aqua-mechanicus access under the Minimum Viable Hydration Initiative. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
wood-pipes=Forge-world annotation: unlocks basic wooden pipework for moving aqua-mechanicus before proper industry has learned to be embarrassed. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
wood-basin=Forge-world annotation: authorizes wet handling infrastructure for materials not yet important enough to deserve a battle-crawler. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
workbench=Forge-world annotation: deploys the first output benediction surface where survival labor can be misidentified as manufacturing. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
thinking-hut=Forge-world annotation: begins primitive ideation by converting piscine biomass, hunger, and damp panic into internally recognized discovery. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
clay-pit=Forge-world annotation: approves mud acquisition as a foundational material strategy. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
pit-kiln=Forge-world annotation: authorizes primitive thermal rite-compliance for kiln-blessed brick, glass, and repeatable smoke. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
growing-plot=Forge-world annotation: begins biological continuity planning for lignum, food, and renewable disappointment. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
cooked-fish=A genetor-approved biomass rite: unlocks basic piscine biomass cooking for crude nutrition and primitive noospheric doctrine handling. Flesh remains weak, but occasionally useful as input.
clay=Forge-world annotation: unlocks consecrated clay working from aqua-mechanicus, lignum, and mineral muck. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
brick=Forge-world annotation: unlocks kiln-blessed brick firing, the first honest structural material in the chain. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
crude-glass=Forge-world annotation: unlocks rough glassmaking for primitive apparatus, condensation work, and brittle progress. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
wood-spear=Forge-world annotation: unlocks wooden spearcraft for fishing, defense, and pointed disagreements with nature. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
cooking-fire=Forge-world annotation: unlocks controlled cooking and low-grade thermal processing, setting up nutrient rite-based research for everything after the primitive phase. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
stone-water-wheel=Forge-world annotation: unlocks a primitive aqua-mechanicus-wheel pump: still weak, but meaningfully better than the beach pump’s miserable trickle. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
aqueduct=Forge-world annotation: unlocks primitive aqueduct handling for moving aqua-mechanicus with gravity instead of wishful thinking. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
stone-basin=Forge-world annotation: unlocks lithic mass basin construction for sturdier wet processing and settlement work. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
shack=Forge-world annotation: unlocks basic shack construction, a shelter one step above apology. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
pondering-hovel=Forge-world annotation: unlocks the pondering hovel, where early research becomes heavier, stranger, and more expensive. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
quarry=Forge-world annotation: unlocks repeatable lithic mass and ore extraction from an island that would rather not cooperate. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
solar-boiler=Forge-world annotation: unlocks low-tech solar sanctified vapor generation using polished surfaces, heat, and questionable patience. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
fish-pond=A genetor-approved biomass rite: unlocks piscine biomass ponds for stabilizing food supply and feeding the early biological chemistry chain. Flesh remains weak, but occasionally useful as input.
meal=A genetor-approved biomass rite: establishes caloric rite-compliance by proving food can be processed into both nutrition and paperwork. Flesh remains weak, but occasionally useful as input.
stone-tools=Forge-world annotation: issues entry-level output benediction implements without warranty, training, or replacement policy. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
primitive-steam-powered-pump=Forge-world annotation: unlocks a rough sanctified vapor-driven pump that trades elegance for pressure and usually wins. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
steam-condenser=Forge-world annotation: unlocks vapor recovery so useful aqua-mechanicus and mineral leftovers can be reclaimed before anyone calls them losses. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
calcifier=Forge-world annotation: unlocks the mineral recovery department, where scale, lithic mass, and aqua-mechanicus are persuaded into feedstock. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
shaler=Forge-world annotation: unlocks the effluvia-cracking rite-compliance associate, turning filth into ore and ore into further obligations. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
waste-processing-2=By sealed decree of the red-robed priesthood, improves calcifier and shaler throughput, turning early effluvia handling into a more reliable ore recovery chain. Handle as blessed contamination, not as a mistake.
waste-processing-3=By sealed decree of the red-robed priesthood, expands effluvia processing into automation-era mineral recovery and radioactive refinement. Handle as blessed contamination, not as a mistake.
waste-processing-4=By sealed decree of the red-robed priesthood, performs the practical implementation of authorized high-throughput effluvia processing after the paperwork has absorbed the interesting objections. Handle as blessed contamination, not as a mistake.
waste-processing-5=By sealed decree of the red-robed priesthood, performs final effluvia-processing throughput after authorization has converted consequences into schedule pressure. Handle as blessed contamination, not as a mistake.
mineral-fractionation=A martial rite of the Forge: unlocks the seawater mineral chain after requisition and work-order authority establish that salt may be processed on purpose. The Machine Spirit hungers for calibration and sanctioned violence.
bio-reactive-processing=A genetor-approved biomass rite: unlocks piscine biomass-derived biochemical processing after certification and evaluation submission make the smell procedurally acceptable. Flesh remains weak, but occasionally useful as input.
biomineral-synthesis=A martial rite of the Forge: unlocks biomineral synthesis once rite-compliance packets and audit-survivable deliverables prove the materials are complicated enough to be approved. The Machine Spirit hungers for calibration and sanctioned violence.
stabilized-emulsion-systems=Forge-world annotation: unlocks stabilized gels and froths after audit survivability and munitorum stakeholder review turn unstable mixtures into deliverables. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
pre-encabulation-materials=Recovered from dubious STC-adjacent marginalia, unlocks the first integrated Omnissian encabulation materials after munitorum stakeholder review and liability containment sanitize the procurement language. Recite the litanies before energizing.
advanced-encabulation-substrates=Recovered from dubious STC-adjacent marginalia, unlocks hyperphase, retrograde, and duplexed substrates once liability containment and board witnessing make advanced failure modes presentable. Recite the litanies before energizing.
Encabulation-research=Recovered from dubious STC-adjacent marginalia, unlocks baseline Omnissian encabulation once audit-survivable deliverables prove the machinery is sufficiently documented to begin failing productively. Recite the litanies before energizing.
Turbo-Encabulation-research=Recovered from dubious STC-adjacent marginalia, unlocks turbo Omnissian encabulation after munitorum stakeholder review summarizes the new risks into something printable. Recite the litanies before energizing.
Hyper-Encabulation-research=Recovered from dubious STC-adjacent marginalia, unlocks hyper Omnissian encabulation once liability containment establishes where the blame should not go. Recite the litanies before energizing.
Rubberized-timber=Forge-world annotation: unlocks timber treatment for flexible crude structural parts and mechanical builds. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
iron-walls=Forge-world annotation: unlocks iron wall research for sturdier defensive construction. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
modular-tank-research=A martial rite of the Forge: implements the authorized tracked rite-compliance platform for field-aligned dispute resolution. The Machine Spirit hungers for calibration and sanctioned violence.
modular-tank-research2=A martial rite of the Forge: implements W.L.S.K. field retrofits after permissioning confirms survivability is an approved narrative. The Machine Spirit hungers for calibration and sanctioned violence.
modular-tank-research3=A martial rite of the Forge: implements specialist battle-crawler platforms once buried denial relic and rite-rocket outcomes have been administratively normalized. The Machine Spirit hungers for calibration and sanctioned violence.
mechanized-infantry-research=Forge-world annotation: implements support logistics for personnel expected to operate near problems created by other departments. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
new-munitions=Forge-world annotation: authorizes expanded kinetic communication options for stakeholders resistant to ordinary deliverables. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
organic-explosives=Forge-world annotation: unlocks synthetic explosive production under risk-assessed work orders and battle-crawler casing approval. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
organic-explosives2=Forge-world annotation: performs the practical portion of the approved explosives escalation package, safely outside the meeting where it was blessed. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
organic-explosives3=Forge-world annotation: implements heavy synthetic explosives and WMD munition rite production after the word “catastrophe” is removed from the deck. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
super-tank-research=A martial rite of the Forge: implements the authorized heavy battle-crawler platform now that actual engineering has been separated from the approval event. The Machine Spirit hungers for calibration and sanctioned violence.
super-tank-research2=A martial rite of the Forge: authorizes strategic annihilation capacity through the sacred doctrine of docketed inevitability. The Machine Spirit hungers for calibration and sanctioned violence.
tank-recall=A martial rite of the Forge: enhances battle-crawlers with recall teleportation for commanders who view logistics as a personal insult and procurement as a suggestion. The Machine Spirit hungers for calibration and sanctioned violence.
charcoal-processing=Forge-world annotation: allows lignum to be converted into a darker, less accountable form of fuel and documentation residue. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
wood-pulp-processing=Forge-world annotation: begins the heroic reduction of useful timber into damp administrative substrate. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
crude-paperwork=Administratum canticle: unlocks the first writable surface sufficiently unpleasant to qualify as administratum documentation. Without the seal, the rite is invalid; without the rite, the machine sulks.
basic-requisitioning=Forge-world annotation: allows resources to be requested incorrectly before being denied correctly. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
work-order-generation=Administratum canticle: converts vague desire into a document that can be misplaced with procedural confidence. Without the seal, the rite is invalid; without the rite, the machine sulks.
work-order-certification=Administratum canticle: applies sufficient stamps, residue, and nutrient rite-adjacent pressure to make a liturgical work mandate appear deliberate. Without the seal, the rite is invalid; without the rite, the machine sulks.
evaluation-submission=Forge-world annotation: permits completed work orders to be submitted into a process nobody fully controls. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
preliminary-risk-assessment=Administratum canticle: identifies obvious risks, names them confidently, and assigns them to a later meeting. Without the seal, the rite is invalid; without the rite, the machine sulks.
risk-assessed-authorization=Forge-world annotation: allows risk to be considered addressed once it has been named, filed, and surrounded by witnesses. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
compliance-packetization=Administratum canticle: combines risk, paperwork, and technically related materials into a packet acceptable to people who will never open it. Without the seal, the rite is invalid; without the rite, the machine sulks.
audit-ready-deliverables=Administratum canticle: prepares materials to survive external review by making them dense, expensive, and unpleasant to question. Without the seal, the rite is invalid; without the rite, the machine sulks.
stakeholder-review-process=Administratum canticle: summarizes operational reality into a format compatible with investor optimism. Without the seal, the rite is invalid; without the rite, the machine sulks.
liability-containment=Forge-world annotation: improves safety by ensuring liability remains inside an approved reporting vessel. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
board-review-procedure=Administratum canticle: unlocks the ceremonial observation of decisions after reversal has become financially impolite. Without the seal, the rite is invalid; without the rite, the machine sulks.
board-advisory-risk-assessment=Administratum canticle: completes the final magisterial ritual by proving that every catastrophic outcome has been anticipated, categorized, and assigned to someone outside the room. Without the seal, the rite is invalid; without the rite, the machine sulks.
ceramic-lattice-conditioning=Forge-world annotation: unlocks ceramic lattice products after evaluations and risk authorization certify that grinding minerals into stranger shapes is intentional. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
organic-substrate-conditioning=Forge-world annotation: unlocks organic substrates after submitted evaluations and risk-assessed authorization surround the biological slurry with witnesses. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
brine-conditioning=Forge-world annotation: unlocks the brine/emulsion branch once preliminary risk and risk-assessed authorization agree that seawater can be made worse. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
ionic-phase-conditioning=Forge-world annotation: unlocks charged ionic media and electro-phase precursors under risk-assessed authorization, stopping short of the rite-compliance packet deadlock. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
alumated-plate-research=Forge-world annotation: authorizes alumated plating for Omnissian encabulator frames and armored structures under the early rite-compliance regime. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
tank-casing-research=A martial rite of the Forge: unlocks basic and reinforced battle-crawler casing work once certified paperwork begins following the metal around. The Machine Spirit hungers for calibration and sanctioned violence.
encabulator-support-componentry=Recovered from dubious STC-adjacent marginalia, unlocks support components for Omnissian encabulator modules under submitted evaluations and risk-assessed work orders. Recite the litanies before energizing.
retro-encabulator-research=Recovered from dubious STC-adjacent marginalia, unlocks retro Omnissian encabulation after rite-compliance packetization certifies that the first serious Omnissian encabulator failure mode is planned. Recite the litanies before energizing.
framulated-encabulator-research=Recovered from dubious STC-adjacent marginalia, unlocks the framulated Omnissian encabulator once board review procedure approves the expensive part of the bad idea. Recite the litanies before energizing.
sperving-arm-research=Recovered from dubious STC-adjacent marginalia, unlocks the first sperving arm under audit-survivable authorization and early Omnissian encabulator support. Recite the litanies before energizing.
ducted-sperving-arm-research=Recovered from dubious STC-adjacent marginalia, unlocks ducted sperving arms after munitorum stakeholder review approves the efficiency narrative. Recite the litanies before energizing.
duplexed-sperving-arm-research=Recovered from dubious STC-adjacent marginalia, unlocks duplexed sperving arms once liability containment agrees the savings are worth the paperwork. Recite the litanies before energizing.
explosive-encabulation-engineering=Recovered from dubious STC-adjacent marginalia, unlocks encabulated explosive engineering after rite-compliance packets and turbo Omnissian encabulation make ordnance sound managed. Recite the litanies before energizing.
industrial-coke-processing=Forge-world annotation: unlocks industrial coke and rubberized timber once liability-contained reports make the smoke somebody else’s issue. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
encabulated-waste-recovery=By sealed decree of the red-robed priesthood, unlocks encabulated effluvia recovery after audit-survivable deliverables and casing research frame the toxic loop as resource efficiency. Handle as blessed contamination, not as a mistake.
waste-processing-4-authorization=By sealed decree of the red-robed priesthood, internal authorization for the next effluvia-processing escalation before non-administratum implementation-chain execution begins. Handle as blessed contamination, not as a mistake.
waste-processing-5-authorization=By sealed decree of the red-robed priesthood, internal board-facing authorization for final effluvia-processing escalation and mass radioactive consequences. Handle as blessed contamination, not as a mistake.
encabulated-device-integration-authorization=Recovered from dubious STC-adjacent marginalia, adeptus Administratum authorization proving Omnissian encabulator devices may be integrated into battle-crawler production without anyone in the room owning the consequences. Recite the litanies before energizing.
encabulated-device-integration=Recovered from dubious STC-adjacent marginalia, performs authorized device integration after the liability waiver has separated engineering from the approval event. Recite the litanies before energizing.
modular-tank-research-authorization=A martial rite of the Forge: adeptus Administratum authorization for modular battle-crawler research, issued before the non-administratum implementation chains begin the practical work. The Machine Spirit hungers for calibration and sanctioned violence.
modular-tank-research2-authorization=A martial rite of the Forge: adeptus Administratum authorization for W.L.S.K. battle-crawler upgrades and improved field survivability. The Machine Spirit hungers for calibration and sanctioned violence.
modular-tank-research3-authorization=A martial rite of the Forge: adeptus Administratum authorization for specialist buried denial relic and rite-rocket battle-crawler platforms. The Machine Spirit hungers for calibration and sanctioned violence.
mechanized-infantry-authorization=Forge-world annotation: internal authorization for infantry support logistics, boxed ammunition, and piscine biomass-based recovery kits. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
new-munitions-authorization=Forge-world annotation: adeptus Administratum authorization for chemical munitions and the paperwork they will inevitably create. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
organic-explosives2-authorization=Forge-world annotation: internal authorization for the second synthetic explosives improvement package. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
organic-explosives3-authorization=Forge-world annotation: internal authorization for the third synthetic explosives package and WMD munition rite escalation. The Omnissiah recognizes effort, documentation, and acceptable collateral heat.
