[mod-setting-name]
tfbf-bobs-advanced-hulls=Enable Bob's advanced tank hull construction alternatives
tfbf-bobs-metallurgy=Enable Bob's Invar encabulation alloy recipe
tfbf-bobs-equipment-grids=Use Bob's vehicle equipment grids on Tanks for Bob vehicles

[mod-setting-description]
tfbf-bobs-equipment-grids=When Bob's Vehicle Equipment is installed and its vehicle grid option is enabled, assign Bob-compatible equipment grids to the fork's custom tanks. Has no effect without Bob's Vehicle Equipment.
tfbf-bobs-advanced-hulls=Adds alternative super-tank recipes using Bob's Mk2 and Mk3 tank hulls, unlocked only after researching both the applicable Bob tank tier and the fork's super-tank technology. Original tank recipes remain available.
tfbf-bobs-metallurgy=Enables an alternative encabuloy alloy recipe using Bob's Invar alloy instead of iron and copper plates. Original recipe and waste byproducts are preserved. Requires Bob's Metals.

[technology-name]
tfbf-bobs-encabuloy-invar=Bob Invar encabulation metallurgy
tfbf-bobs-hulls-mk2=Bob Mk2 hull integration
tfbf-bobs-hulls-mk3=Bob Mk3 WMD hull integration

[technology-description]
tfbf-bobs-encabuloy-invar=Integrate Bob Invar alloy with the fork's encabulation material chain without disrupting existing recycling and waste outputs.
tfbf-bobs-hulls-mk2=Adapt the Tank Mk2 chassis to the fork's super-tank variants. Requires both Bob's Mk2 research and super-tank integration.
tfbf-bobs-hulls-mk3=Adapt the Tank Mk3 chassis to super-tank WMD construction. Requires Bob's Mk3 and the fork's WMD research.

[recipe-name]
tfbf-bobs-encabuloy-invar=Encabuloy alloy (Bob Invar variant)
tfbf-bobs-super-tank-mk2=Super tank (Bob Mk2 chassis)
tfbf-bobs-super-tank-alternate-mk2=Alternate super tank (Bob Mk2 chassis)
tfbf-bobs-super-tank-wmd-mk3=WMD super tank (Bob Mk3 chassis)
