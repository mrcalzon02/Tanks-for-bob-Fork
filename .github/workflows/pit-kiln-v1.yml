name: Pit kiln V1 | reusable clay earthwork Blender reconstruction

on:
  push:
    branches: [main]
    paths:
      - 'models/island-survival/pit-kiln/v1/*.py'
      - '.github/workflows/pit-kiln-v1.yml'
      - 'docs/art/PIT_KILN_V1_BUILD_SHEET.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pit-kiln-v1
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install Blender and Pillow
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender python3-pil
          python3 -m py_compile models/island-survival/pit-kiln/v1/*.py
      - name: Build pit kiln V1 in editable Blender from Clay Pit V3 basin
        run: |
          blender -b -t 4 models/island-survival/clay-pit/generated-v3/clay-pit-v3.blend \
            --python-exit-code 1 \
            --python models/island-survival/pit-kiln/v1/build_pit_kiln_v1.py -- \
            --out /tmp/pit-kiln-v1 --samples 24
      - name: Validate all frame captures and make visible proof
        run: |
          /usr/bin/python3 models/island-survival/pit-kiln/v1/make_pit_kiln_v1_review.py \
            --out /tmp/pit-kiln-v1 --mod tanks_for_bob_fork_1.8.95
      - name: Reopen editable source and check original camera and flame keys
        run: |
          blender -b -t 4 /tmp/pit-kiln-v1/pit-kiln-v1.blend --python-exit-code 1 --python-expr "import bpy; s=bpy.context.scene; b=next(o for o in s.objects if 'one broad excavated clay bowl' in o.name); flames=[o for o in s.objects if o.name.startswith('BURNING | flame tongue')]; assert len(flames)==8; assert all(o.animation_data for o in flames); assert s.camera.data.type=='ORTHO'; assert abs(s.camera.data.ortho_scale-3.15)<.001; print('PIT_KILN_V1_NATIVE_REOPEN_PASS')"
      - name: Check render evidence
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/pit-kiln-v1')
          q=json.loads((p/'review-qa.json').read_text())
          r=json.loads((p/'build-report.json').read_text())
          assert q['passed'] and q['frame_count']==68
          assert r['basin_count']==1 and r['flame_count']==8
          assert (p/'pit-kiln-v1.blend').stat().st_size>10000
          assert len(q['gifs'])==4
          print('PIT_KILN_V1_COMPLETED')
          PY
      - name: Publish original Blender render evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pit-kiln-v1-blender-four-direction-animation
          path: /tmp/pit-kiln-v1/
          if-no-files-found: warn
      - name: Commit editable V1 and previews for source control
        run: |
          mkdir -p models/island-survival/pit-kiln/generated-v1
          cp -a /tmp/pit-kiln-v1/. models/island-survival/pit-kiln/generated-v1/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add models/island-survival/pit-kiln/generated-v1/
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'art(pit-kiln): publish Blender V1 four-view kiln and primitive fire'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
