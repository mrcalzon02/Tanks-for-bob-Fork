name: Pit Kiln V6 | Factorio 2.1 release 1.8.98
on:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: pit-kiln-v6-factorio21-release
  cancel-in-progress: false
jobs:
  verify-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-pil
      - name: Build proven 1.8.96 campfire Factorio 2.1 base
        run: |
          python3 tools/art/build_accepted_campfire_21.py --output /tmp/accepted-base-21
      - name: Reconstruct 1.8.97 clay pit approved release
        run: |
          /usr/bin/python3 tools/art/build_clay_pit_21_release.py \
            --base /tmp/accepted-base-21/tanks_for_bob_fork_1.8.96.zip \
            --output /tmp/accepted-clay-21
      - name: Integrate approved Pit Kiln V6 into complete 1.8.98 mod
        run: |
          /usr/bin/python3 tools/art/build_pit_kiln_21_release.py \
            --base /tmp/accepted-clay-21/tanks_for_bob_fork_1.8.97.zip \
            --output /tmp/accepted-kiln-21
      - name: Download pinned official Factorio 2.1.23 headless engine
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/engine"
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/engine/factorio.tar.xz" \
            'https://factorio.com/get-download/2.1.23/headless/linux64'
          tar -xJf "$RUNNER_TEMP/engine/factorio.tar.xz" -C "$RUNNER_TEMP/engine"
          "$RUNNER_TEMP/engine/factorio/bin/x64/factorio" --version | tee /tmp/accepted-kiln-21/engine-version.txt
          grep -Fq '2.1.23' /tmp/accepted-kiln-21/engine-version.txt
      - name: Official game loading, map creation and benchmark
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mods"
          cp /tmp/accepted-kiln-21/tanks_for_bob_fork_1.8.98.zip "$RUNNER_TEMP/mods/"
          python3 - <<'PY'
          import os,json
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'mods/mod-list.json'
          p.write_text(json.dumps({'mods':[{'name':'base','enabled':True},
            {'name':'tanks_for_bob_fork','enabled':True}]})+'\n')
          PY
          engine="$RUNNER_TEMP/engine/factorio/bin/x64/factorio"
          "$engine" --mod-directory "$RUNNER_TEMP/mods" --create "$RUNNER_TEMP/pit-kiln-19898.zip" \
            --map-gen-seed 20261107 2>&1 | tee /tmp/accepted-kiln-21/engine-create.log
          grep -Fq 'Loading mod tanks_for_bob_fork' /tmp/accepted-kiln-21/engine-create.log
          "$engine" --mod-directory "$RUNNER_TEMP/mods" \
            --benchmark "$RUNNER_TEMP/pit-kiln-19898.zip" --benchmark-ticks 300 \
            2>&1 | tee /tmp/accepted-kiln-21/engine-benchmark.log
          echo 'PIT_KILN_V6_OFFICIAL_FACTORIO_21_PASS'
      - name: Upload approved V6 release to Mod Portal
        env:
          FACTORIO_MOD_UPLOAD_KEY: ${{ secrets.FACTORIO_MOD_UPLOAD_KEY }}
        run: |
          /usr/bin/python3 tools/art/publish_pit_kiln_21_release.py /tmp/accepted-kiln-21
      - name: Retain full mod and validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tanks-for-bob-1.8.98-pit-kiln-v6-factorio21
          path: /tmp/accepted-kiln-21/
          if-no-files-found: warn
          retention-days: 30
