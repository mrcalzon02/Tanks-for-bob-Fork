name: Lumberyard label and item preview | Factorio 2.1 release 1.8.100
on:
  push:
    branches: [main]
    paths:
      - 'tools/art/build_lumberyard_name_21_release.py'
      - 'tools/art/publish_lumberyard_name_21_release.py'
      - '.github/workflows/lumberyard-name-factorio21-release.yml'
      - 'docs/releases/v1.8.100.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lumberyard-label-factorio21
  cancel-in-progress: false
jobs:
  verify-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow and compile release scripts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-pil
          python3 -m py_compile tools/art/build_lumberyard_name_21_release.py tools/art/publish_lumberyard_name_21_release.py
      - name: Build accepted Factorio 2.1 campfire 1.8.96
        run: |
          python3 tools/art/build_accepted_campfire_21.py --output /tmp/base-21
      - name: Build accepted Clay Pit 1.8.97
        run: |
          /usr/bin/python3 tools/art/build_clay_pit_21_release.py \
            --base /tmp/base-21/tanks_for_bob_fork_1.8.96.zip --output /tmp/clay-21
      - name: Build accepted Pit Kiln 1.8.98
        run: |
          /usr/bin/python3 tools/art/build_pit_kiln_21_release.py \
            --base /tmp/clay-21/tanks_for_bob_fork_1.8.97.zip --output /tmp/kiln-21
      - name: Build accepted Steam Lumberyard 1.8.99
        run: |
          /usr/bin/python3 tools/art/build_lumberyard_21_release.py \
            --base /tmp/kiln-21/tanks_for_bob_fork_1.8.98.zip --output /tmp/lumber-21
      - name: Apply Lumberyard display name and approved item icon to 1.8.100
        run: |
          /usr/bin/python3 tools/art/build_lumberyard_name_21_release.py \
            --base /tmp/lumber-21/tanks_for_bob_fork_1.8.99.zip --output /tmp/lumber-name-21
      - name: Download official Factorio 2.1.23 headless
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/engine"
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/engine/factorio.tar.xz" \
            'https://factorio.com/get-download/2.1.23/headless/linux64'
          tar -xJf "$RUNNER_TEMP/engine/factorio.tar.xz" -C "$RUNNER_TEMP/engine"
          "$RUNNER_TEMP/engine/factorio/bin/x64/factorio" --version | tee /tmp/lumber-name-21/engine-version.txt
          grep -Fq '2.1.23' /tmp/lumber-name-21/engine-version.txt
      - name: Official Factorio full mod load/map creation/300-tick benchmark
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mods"
          cp /tmp/lumber-name-21/tanks_for_bob_fork_1.8.100.zip "$RUNNER_TEMP/mods/"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'mods/mod-list.json'
          p.write_text(json.dumps({'mods':[{'name':'base','enabled':True},
            {'name':'tanks_for_bob_fork','enabled':True}]})+'\n')
          PY
          engine="$RUNNER_TEMP/engine/factorio/bin/x64/factorio"
          "$engine" --mod-directory "$RUNNER_TEMP/mods" --create "$RUNNER_TEMP/lumber-name-world.zip" \
            --map-gen-seed 20261107 2>&1 | tee /tmp/lumber-name-21/engine-create.log
          grep -Fq 'Loading mod tanks_for_bob_fork' /tmp/lumber-name-21/engine-create.log
          "$engine" --mod-directory "$RUNNER_TEMP/mods" \
            --benchmark "$RUNNER_TEMP/lumber-name-world.zip" --benchmark-ticks 300 \
            2>&1 | tee /tmp/lumber-name-21/engine-benchmark.log
          echo 'LUMBERYARD_DISPLAY_NAME_1_8_100_ENGINE_PASS'
      - name: Publish verified corrected release to actual Factorio Mod Portal
        env:
          FACTORIO_MOD_UPLOAD_KEY: ${{ secrets.FACTORIO_MOD_UPLOAD_KEY }}
        run: |
          /usr/bin/python3 tools/art/publish_lumberyard_name_21_release.py /tmp/lumber-name-21
      - name: Retain installable ZIP and official release receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tanks-for-bob-1.8.100-lumberyard-name-and-icon
          path: /tmp/lumber-name-21/
          if-no-files-found: warn
          retention-days: 30
