name: Publish verified Tanks for Bob v1.8.93

# Publication requires a successfully completed push-triggered, official-only
# test matrix for the EXACT main-branch source commit being packaged.
on:
  workflow_run:
    workflows:
      - "Tanks for Bob | official Factorio compatibility"
    types: [completed]

permissions:
  contents: write
  actions: read

concurrency:
  group: tanks-for-bob-v1.8.93-release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish the verified Factorio 2.0 ZIP
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_SHA: ${{ github.event.workflow_run.head_sha }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      REPO: ${{ github.repository }}
      TAG: v1.8.93
      MOD_DIR: tanks_for_bob_fork_1.8.93
      ARCHIVE: tanks_for_bob_fork_1.8.93.zip
    steps:
      - name: Check out precisely the tested source tree
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1

      - name: Prove the successful run covers every required test profile
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$REPO/actions/runs/$RUN_ID" > "$RUNNER_TEMP/verified-run.json"
          gh api "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" > "$RUNNER_TEMP/verified-jobs.json"
          python3 - "$RUN_SHA" "$RUNNER_TEMP/verified-run.json" "$RUNNER_TEMP/verified-jobs.json" <<'PY'
          import json, sys
          sha, run_file, jobs_file = sys.argv[1:]
          run = json.load(open(run_file))
          jobs = json.load(open(jobs_file))["jobs"]
          expected = "Factorio official suite (12 profiles + static)"
          assert run["conclusion"] == "success" and run["head_sha"] == sha, "Run not verified"
          assert run["event"] == "push" and run["head_branch"] == "main", "Not main push"
          assert len(jobs) == 1, f"Expected ONE audit job, got {len(jobs)}"
          assert jobs[0]["name"] == expected and jobs[0]["conclusion"] == "success", (
              "One-job audit is not verified")
          print("[TANKS-RELEASE] VERIFIED one successful audit job for", sha)
          PY

      - name: Verify source identity and main has not advanced
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RUN_SHA"
          upstream_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ "$upstream_sha" != "$RUN_SHA" ]]; then
            echo "::error::Main advanced since verification; refusing to release older tree."
            exit 1
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("tanks_for_bob_fork_1.8.93")
          meta = json.loads((p / "info.json").read_text())
          assert meta["name"] == "tanks_for_bob_fork"
          assert meta["version"] == "1.8.93"
          assert meta["factorio_version"] == "2.0", "Do not publish untested 2.1 artifact"
          for path in ["README.md", "control.lua", "data.lua", "prototypes/item/ammo.lua"]:
              assert (p / path).is_file(), path
          text = (p / "README.md").read_text()
          for phrase in ["12 Factorio engine configurations", "26/26", "12/12", "not", "Factorio 2.1"]:
              assert phrase in text, f"Package README missing: {phrase}"
          assert Path("docs/releases/v1.8.93.md").is_file()
          print("[TANKS-RELEASE] SOURCE_PASS", meta["name"], meta["version"])
          PY
          python3 ci/validate_mod.py --report "$RUNNER_TEMP/release-static-audit.json"

      - name: Ensure no tag or published release will be overwritten
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "::notice::Release $TAG already exists; do not overwrite it."
            exit 0
          fi
          if git ls-remote --exit-code origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG exists but no GitHub release was found; manual reconciliation needed."
            exit 1
          fi

      - name: Build installable mod ZIP, checksum and standalone audit report
        shell: bash
        run: |
          set -euo pipefail
          zip -X -q -r "$ARCHIVE" "$MOD_DIR"
          python3 - <<'PY'
          import json, os, zipfile
          archive = "tanks_for_bob_fork_1.8.93.zip"
          top = "tanks_for_bob_fork_1.8.93/"
          with zipfile.ZipFile(archive) as z:
              bad = z.testzip()
              assert bad is None, f"CRC check failed at {bad}"
              paths = set(z.namelist())
              assert all(x.startswith(top) for x in paths), "Unexpected ZIP root"
              assert top + "info.json" in paths
              assert top + "README.md" in paths
              assert not any("/ci_" in x or x.endswith("/data-final-fixes.lua")
                             for x in paths), "CI harness leaked into release"
              info = json.loads(z.read(top + "info.json"))
              assert info["factorio_version"] == "2.0" and info["version"] == "1.8.93"
              print("[TANKS-RELEASE] PACKAGE_PASS", len(paths), "entries",
                    os.path.getsize(archive), "bytes")
          PY
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
          {
            cat docs/compatibility/OFFICIAL_MOD_SUPPORT.md
            printf '\n\n---\n\n'
            cat docs/compatibility/CURRENT_STATE_AUDIT.md
          } > compatibility-v1.8.93.md

      - name: Publish GitHub release with verified artifacts
        shell: bash
        run: |
          set -euo pipefail
          # Never replace a tag or update an existing release.
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "::notice::Another publisher already created the release; leaving it intact."
            exit 0
          fi
          gh release create "$TAG" \
            "$ARCHIVE" "$ARCHIVE.sha256" compatibility-v1.8.93.md \
            --repo "$REPO" \
            --target "$RUN_SHA" \
            --title "Tanks for Bob Fork v1.8.93 — Factorio official compatibility" \
            --notes-file docs/releases/v1.8.93.md \
            --latest
          gh release view "$TAG" --repo "$REPO" --json tagName,isDraft,isPrerelease,assets,url \
            > "$RUNNER_TEMP/published-release.json"
          python3 - "$RUNNER_TEMP/published-release.json" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1]))
          assert data["tagName"] == "v1.8.93"
          assert not data["isDraft"], "Release is only a draft"
          assets = {a["name"] for a in data["assets"]}
          assert {
              "tanks_for_bob_fork_1.8.93.zip",
              "tanks_for_bob_fork_1.8.93.zip.sha256",
              "compatibility-v1.8.93.md"
          } <= assets, "Missing release asset(s)"
          print("[TANKS-RELEASE] PUBLISHED_AND_VERIFIED", data["url"])
          PY
