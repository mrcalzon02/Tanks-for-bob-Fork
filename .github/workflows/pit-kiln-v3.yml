name: Pit Kiln V3 | actual authored campfire animation reuse
on:
  push:
    branches: [main]
    paths:
      - 'models/island-survival/pit-kiln/v3/*.py'
      - '.github/workflows/pit-kiln-v3.yml'
      - 'docs/art/PIT_KILN_V3_REAL_CAMPFIRE.md'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pit-kiln-v3
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install Blender and Pillow
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender python3-pil
          python3 -m py_compile models/island-survival/pit-kiln/v3/*.py
      - name: Import original Campfire V9 animated meshes and render 68 kiln source frames
        run: |
          blender -b -t 4 models/island-survival/pit-kiln/generated-v2/pit-kiln-v2.blend \
            --python-exit-code 1 \
            --python models/island-survival/pit-kiln/v3/build_pit_kiln_v3.py -- \
            --campfire models/island-survival/blender/generated-v9/campfire-v9-animated.blend \
            --out /tmp/pit-kiln-v3 --samples 24
      - name: Verify all directions and original campfire flame action provenance
        run: |
          /usr/bin/python3 models/island-survival/pit-kiln/v3/make_pit_kiln_v3_review.py \
            --out /tmp/pit-kiln-v3 --mod tanks_for_bob_fork_1.8.95
      - name: Independently reopen edited kiln source in Blender
        run: |
          blender -b -t 4 /tmp/pit-kiln-v3/pit-kiln-v3-real-campfire.blend \
            --python-exit-code 1 --python-expr "import bpy; objs=list(bpy.context.scene.objects); f=[o for o in objs if o.name.startswith('flame_tongue')]; o=[o for o in objs if o.name.startswith('BURNING | flame tongue')]; board=[o for o in objs if o.name=='V2 | rough support plank for unfired bricks']; brick=[o for o in objs if o.name.startswith('V2 | WET BRICK on slab')]; assert len(f)==6 and not o and len(board)==1 and len(brick)==4; assert all(x.animation_data and x.animation_data.action for x in f); assert bpy.context.scene.camera.data.type=='ORTHO'; print('REAL_CAMPFIRE_ACTIONS_AND_KILN_BRICKS_REOPEN_PASS')"
      - name: Check published render/QA evidence
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('/tmp/pit-kiln-v3')
          q=json.loads((p/'review-qa.json').read_text())
          r=json.loads((p/'build-report.json').read_text())
          assert q['passed'] and q['actual_frames']==68
          assert r['imported_flame_count']==6 and r['removed_old_fake_flames']==8
          assert r['retained_bank_bricks']==10 and r['retained_staging_bricks']==4
          assert len(q['real_source_actions'])==6 and len([x for x in p.glob('burning-d*-preview.gif')])==4
          print('PIT_KILN_V3_REUSED_CAMPFIRE_PIPELINE_PASS')
          PY
      - name: Retain actual native Blender proof even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pit-kiln-v3-reused-campfire-fire-evidence
          path: /tmp/pit-kiln-v3/
          if-no-files-found: warn
      - name: Commit versioned kiln with imported animated campfire
        run: |
          mkdir -p models/island-survival/pit-kiln/generated-v3
          cp -a /tmp/pit-kiln-v3/. models/island-survival/pit-kiln/generated-v3/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add models/island-survival/pit-kiln/generated-v3/
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'art(pit-kiln): reuse actual V9 campfire animation and preserve V2 brick staging'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
