name: Campfire native Blender scene

on:
  push:
    branches: [main]
    paths:
      - 'models/island-survival/blender/*.py'
      - '.github/workflows/campfire-blender.yml'
      - 'tools/art/*.py'
      - 'tools/art/profiles/*.json'
      - 'docs/art/FACTORIO_PRODUCTION_*'
      - 'models/island-survival/blender/CAMPFIRE_PRODUCTION_EXPORT_CHECKLIST.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-scene:
    name: Blender scene + previews
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install Blender and image tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender python3-pil
          blender --version | head -3
      - name: Validate versioned sprite-export work order
        run: |
          python3 -m unittest discover -s tools/art -p 'test_*.py' -v
          python3 tools/art/validate_export_checklist.py \
            models/island-survival/blender/CAMPFIRE_PRODUCTION_EXPORT_CHECKLIST.md \
            --require plan
          # 'plan' verifies the ledger; export/publish remain separately gated
          # until their actual Blender/Factorio/approval evidence is entered.
      - name: Reconstruct V6 physical geometry
        run: |
          python3 models/island-survival/blender/rebuild_campfire_v6.py \
            --v4 models/island-survival/refined/build_campfire_v4.py \
            --out /tmp/tanks-for-bob-campfire
      - name: Build native animated Blender scene and render previews
        run: |
          blender -b -t 4 --python models/island-survival/blender/build_campfire_scene.py -- \
            --obj /tmp/tanks-for-bob-campfire/campfire-smoothed-v6.obj \
            --out models/island-survival/blender/generated \
            --samples 20 --resolution 512
      - name: Refine V8 materials and fire animation INSIDE native Blender
        run: |
          blender -b -t 4 models/island-survival/blender/generated/campfire-v7-animated.blend \
            --python models/island-survival/blender/refine_campfire_v8.py -- \
            --out models/island-survival/blender/generated-v8 --samples 20 --resolution 512
      - name: V9 charred firewood only during native burning state
        run: |
          blender -b -t 4 models/island-survival/blender/generated-v8/campfire-v8-animated.blend \
            --python models/island-survival/blender/char_core_campfire_v9.py -- \
            --out models/island-survival/blender/generated-v9 --samples 20 --resolution 512
      - name: Render actual keyframed Blender animation (16 Cycles frames)
        run: |
          blender -b -t 4 models/island-survival/blender/generated-v9/campfire-v9-animated.blend \
            --python models/island-survival/blender/render_campfire_gif_frames.py -- \
            --out /tmp/campfire-gif-frames --resolution 320 --samples 12
      - name: Assemble and verify looping animation GIF
        run: |
          sudo apt-get install -y python3-pil
          /usr/bin/python3 models/island-survival/blender/assemble_campfire_gif.py \
            --frames /tmp/campfire-gif-frames \
            --out models/island-survival/blender/generated-v9/campfire-v9-animated.gif
      - name: Verify actual saved Blender mesh objects and animation keys
        run: |
          blender -b -t 4 models/island-survival/blender/generated/campfire-v7-animated.blend \
            --python models/island-survival/blender/inspect_campfire_scene.py -- \
            models/island-survival/blender/generated/campfire-v7-object-manifest.json
      - name: Verify V8 native material graph and shape-key animation
        run: |
          blender -b -t 4 models/island-survival/blender/generated-v8/campfire-v8-animated.blend \
            --python models/island-survival/blender/verify_campfire_v8.py -- \
            models/island-survival/blender/generated-v8/campfire-v8-object-manifest.json
      - name: Reopen V9 scene and verify conditional wood-char shader
        run: |
          blender -b -t 4 models/island-survival/blender/generated-v9/campfire-v9-animated.blend \
            --python models/island-survival/blender/verify_campfire_v9.py -- \
            models/island-survival/blender/generated-v9/campfire-v9-object-manifest.json
      - name: Verify scene and preview artifacts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('models/island-survival/blender/generated-v9')
          must=['campfire-v9-animated.blend','campfire-v9-idle-natural-wood.png',
                'campfire-v9-burning-charred-core.png','campfire-v9-char-only-study.png','campfire-v9-native64.png',
                'campfire-v9-build-report.txt','campfire-v9-animated.gif',
                'campfire-v9-object-manifest.json']
          for file in must:
            f=p/file
            assert f.exists() and f.stat().st_size>100, f'Missing or empty: {f}'
            print(f'{file}: {f.stat().st_size} bytes')
          data=(p/'campfire-v9-build-report.txt').read_text()
          assert 'Native Blender V9 core firewood char' in data
          assert (p/'campfire-v9-idle-natural-wood.png').read_bytes() != (p/'campfire-v9-burning-charred-core.png').read_bytes(), 'Identical idle/burning renders'
          assert (p/'campfire-v9-idle-natural-wood.png').read_bytes() != (p/'campfire-v9-char-only-study.png').read_bytes(), 'Char-only material change is invisible'
          assert (p/'campfire-v9-burning-charred-core.png').read_bytes() != (p/'campfire-v9-char-only-study.png').read_bytes(), 'Char-only study still shows flames'
          PY
      - name: Export and reopen verified Blender sprite atlases
        run: |
          sudo apt-get install -y python3-pil
          /usr/bin/python3 tools/art/export_sprites.py \
            --config tools/art/profiles/campfire.json --out /tmp/campfire-production
          /usr/bin/python3 tools/art/export_sprites.py \
            --config tools/art/profiles/campfire-static-four-view.json --out /tmp/campfire-static
      - name: Validate four full animated directions and stage published sprite files
        run: |
          /usr/bin/python3 - <<'PY'
          import json
          from pathlib import Path
          animated = Path('/tmp/campfire-production')
          static = Path('/tmp/campfire-static')
          a = json.loads((animated / 'qa.json').read_text())
          s = json.loads((static / 'qa.json').read_text())
          assert a['passed'] and a['capture_count'] == 68 and a['atlas_count'] == 6, a
          assert s['passed'] and s['capture_count'] == 4, s
          for entry in a['sheets']:
              assert entry['direction_count'] == 4, entry
              assert entry['frame_count'] == (16 if entry['state'] == 'burning' else 1), entry
              if entry['cell_size'] == 256:
                  assert entry['dimensions'] == ([2048, 2048] if entry['state'] == 'burning' else [256, 1024]), entry
          for d in range(4):
              assert (animated / f'burning-d{d:02d}-preview.gif').is_file()
              assert len(list((animated / 'frames' / 'burning' / f'd{d:02d}').glob('*.png'))) == 16
              assert len(list((animated / 'frames' / 'idle' / f'd{d:02d}').glob('*.png'))) == 1
          print('FOUR_VIEW_ANIMATION_VERIFIED: 64 animated + 4 idle source frames, 6 full atlases, 4 GIF previews')
          PY
          mkdir -p models/island-survival/blender/production-v11-four-view/static-four-view
          cp -a /tmp/campfire-production/. models/island-survival/blender/production-v11-four-view/
          cp -a /tmp/campfire-static/. models/island-survival/blender/production-v11-four-view/static-four-view/
      - name: Publish verified sprite export evidence
        uses: actions/upload-artifact@v4
        with:
          name: campfire-blender-sprite-export
          path: |
            /tmp/campfire-production/
            /tmp/campfire-static/
            tanks_for_bob_fork_1.8.95/graphics/entity/campfire.png
            tanks_for_bob_fork_1.8.95/graphics/entity/campfire-w.png
          if-no-files-found: error
      - name: Publish Blender artifact archive
        uses: actions/upload-artifact@v4
        with:
          name: campfire-v9-blender-animated
          path: models/island-survival/blender/generated-v9/
          if-no-files-found: error
      - name: Commit generated native scene and renders to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add models/island-survival/blender/generated-v9/
          git add models/island-survival/blender/production-v11-four-view/
          if ! git diff --cached --quiet; then
            git commit -m 'art(blender): publish V9 conditional core-char Blender scene'
            git push origin HEAD:main
          else
            echo 'Native Blender output is unchanged.'
          fi
