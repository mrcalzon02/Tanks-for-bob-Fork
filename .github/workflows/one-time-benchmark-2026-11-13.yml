name: Tanks for Bob | one-time audited 1.8.102 GitHub benchmark prerelease

# A single explicitly requested release action. No scheduled runs, and ordinary
# commits do not trigger it. The only push trigger is the one-time marker below.
on:
  push:
    paths:
      - 'docs/releases/dispatch-benchmark-2026-11-13.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tanks-benchmark-2026-11-13
  cancel-in-progress: false

jobs:
  benchmark:
    name: Package and publish exact frozen 2.1 snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check immutable source, exact tag, and no-retag condition
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:tanks_for_bob_fork_1.8.102)" = "96a503c5b94f68da64ea71766a2a09228c9426ee"
          git cat-file -e '1a1dcbfc05b29631e34957349676311ff4a8e365^{commit}'
          test -f docs/releases/BENCHMARK_2026-11-13_1.8.102.md
          test "$(python3 ci/validate_mod.py --select-only)" = "tanks_for_bob_fork_1.8.102"
          tag='v1.8.102-benchmark.20261113'
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release already exists. Refusing to overwrite or retag."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Tag already exists. Refusing to overwrite or retag."
            exit 1
          fi

      - name: Static validation and deterministic installable archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p benchmark-evidence
          python3 -m py_compile ci/validate_mod.py ci/package_mod.py
          python3 ci/validate_mod.py --report benchmark-evidence/static-audit.json
          python3 ci/package_mod.py --output dist | tee benchmark-evidence/package-log.json

      - name: Verify archive identity and write release receipts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from datetime import datetime, timezone
          from hashlib import sha256
          from pathlib import Path
          import json, zipfile
          src=Path('tanks_for_bob_fork_1.8.102')
          package=Path('dist/tanks_for_bob_fork_1.8.102.zip')
          checksum=Path('dist/tanks_for_bob_fork_1.8.102.zip.sha256')
          actual=sha256(package.read_bytes()).hexdigest()
          assert checksum.read_text().strip() == actual+'  '+package.name
          files=sorted(p for p in src.rglob('*') if p.is_file())
          assert len(files)==598, f'Unexpected source file count: {len(files)}'
          with zipfile.ZipFile(package) as archive:
              assert archive.testzip() is None
              assert len(archive.namelist())==len(files)
              for file in files:
                  arcname=src.name+'/'+file.relative_to(src).as_posix()
                  assert archive.read(arcname)==file.read_bytes(), arcname
              meta=json.loads(archive.read(src.name+'/info.json'))
              assert (meta['version'],meta['factorio_version'])==('1.8.102','2.1')
              for required in (
                  'data-final-fixes.lua',
                  'prototypes/generated_graphics/cooking-fire-v2-production.lua',
                  'prototypes/generated_graphics/solar-boiler-v8-production.lua',
                  'graphics/entity/solar-boiler-v8/working-256.png',
              ):
                  assert src.name+'/'+required in archive.namelist(), required
          report={
              'kind':'release-artifact-receipt',
              'release_tag':'v1.8.102-benchmark.20261113',
              'source_commit':'1a1dcbfc05b29631e34957349676311ff4a8e365',
              'mod_tree':'96a503c5b94f68da64ea71766a2a09228c9426ee',
              'mod_info_version':'1.8.102',
              'factorio_major':'2.1',
              'archive':package.name,
              'archive_sha256':actual,
              'archived_files':len(files),
              'archive_integrity':'byte-for-byte source match',
              'engine_test_this_workflow':False,
              'historical_engine_evidence':'https://github.com/mrcalzon02/Tanks-for-bob-Fork/actions/runs/42893564032',
              'solar_component_engine_evidence':'https://github.com/mrcalzon02/Tanks-for-bob-Fork/actions/runs/43120594298',
              'created_utc':datetime.now(timezone.utc).isoformat()
          }
          Path('benchmark-evidence/benchmark-manifest.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,indent=2))
          PY
          cat > benchmark-evidence/release-notes.md <<'EOF'
          ## Factorio 2.1 development benchmark — 13 November 2026

          **Reproducible installable snapshot, not a Mod Portal release.**
          This prerelease freezes the exact active 1.8.102 game source at commit
          `1a1dcbfc05b29631e34957349676311ff4a8e365`
          (mod tree `96a503c5b94f68da64ea71766a2a09228c9426ee`).

          **Contents:** 1.8.102 progression and fish-resource recovery; four-way
          corrected Workbench V8; active Cooking Fire V2; Solar Boiler V8 art and
          native fixed ports. Base Factorio 2.1 required; official expansion
          modules optional. Beach Pump V5 art and the unfinished steam pump/
          condenser and Bob's Mods integrations are not included.

          **Evidence:** Previous full official-profile Factorio 2.1.24 compatibility
          tests passed before Solar Boiler V8; the subsequent V8 component-specific
          Factorio 2.1.24 engine smoke passed 12/12 pipe attachments in four
          orientations. This release action validates current source references
          and exact ZIP archive bytes. It **does not claim a fresh full native
          Factorio runtime test, two-client multiplayer, or approval of visual
          pipe-port alignment** on this exact benchmark ZIP.

          **Downloads:** Install the `tanks_for_bob_fork_1.8.102.zip` archive
          directly into Factorio's mods directory; the `.sha256` and
          `benchmark-manifest.json` accompany the archive for independent
          verification. No existing tag or release is altered.

          [Complete checkpoint audit](https://github.com/mrcalzon02/Tanks-for-bob-Fork/blob/main/docs/releases/BENCHMARK_2026-11-13_1.8.102.md)
          | [Earlier official suite](https://github.com/mrcalzon02/Tanks-for-bob-Fork/actions/runs/42893564032)
          | [Solar Boiler V8 native smoke](https://github.com/mrcalzon02/Tanks-for-bob-Fork/actions/runs/43120594298)
          | [Pending GUI screenshot review](https://github.com/mrcalzon02/Tanks-for-bob-Fork/issues/4)
          EOF

      - name: Publish one new benchmark prerelease without retagging
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create 'v1.8.102-benchmark.20261113' \
            'dist/tanks_for_bob_fork_1.8.102.zip' \
            'dist/tanks_for_bob_fork_1.8.102.zip.sha256' \
            'benchmark-evidence/benchmark-manifest.json' \
            --repo "$GITHUB_REPOSITORY" \
            --target '1a1dcbfc05b29631e34957349676311ff4a8e365' \
            --prerelease \
            --title 'Tanks for Bob Fork 1.8.102 — Development benchmark (2026-11-13)' \
            --notes-file 'benchmark-evidence/release-notes.md'

      - name: Independently read back the published GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view 'v1.8.102-benchmark.20261113' --repo "$GITHUB_REPOSITORY" --json tagName,isPrerelease,isDraft,assets,url > benchmark-evidence/release-readback.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('benchmark-evidence/release-readback.json').read_text())
          assert r['tagName']=='v1.8.102-benchmark.20261113'
          assert r['isPrerelease'] and not r['isDraft']
          assert {'tanks_for_bob_fork_1.8.102.zip','tanks_for_bob_fork_1.8.102.zip.sha256','benchmark-manifest.json'} <= {a['name'] for a in r['assets']}
          print('GITHUB_BENCHMARK_RELEASE_READBACK_PASSED',r['url'])
          PY

      - name: Preserve diagnostics even if publishing fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tanks-1.8.102-benchmark-audit
          path: benchmark-evidence/
          if-no-files-found: warn
          retention-days: 30
