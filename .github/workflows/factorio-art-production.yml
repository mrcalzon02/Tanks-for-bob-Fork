name: Factorio reusable four-way art production

on:
  workflow_dispatch:
    inputs:
      job:
        description: Repository-relative production job JSON
        required: false
        default: tools/art/jobs/campfire-next.json
      publish:
        description: Render/install graphics only and publish
        type: boolean
        required: false
        default: false
      deploy:
        description: Render/install graphics, attach prototype, publish
        type: boolean
        required: false
        default: false
      replace_attachment:
        description: Replace an older managed attachment for the same prototype
        type: boolean
        required: false
        default: false
  push:
    branches: [main]
    paths:
      - tools/art/jobs/solar-boiler-v4-wood-proof.json

permissions:
  contents: write
  actions: read
concurrency:
  group: factorio-reusable-art-production
  cancel-in-progress: false

jobs:
  four-way-export:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install Blender and image tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender python3-pil lua5.4
          blender --version | head -3
      - name: Run all export regression tests
        run: |
          /usr/bin/python3 -m unittest discover -s tools/art -p 'test_*.py' -v
      - name: Execute reusable pipeline (full render on manual run)
        if: github.event_name == 'workflow_dispatch'
        env:
          JOB_FILE: ${{ inputs.job || 'tools/art/jobs/campfire-next.json' }}
          PUBLISH: ${{ inputs.publish || false }}
          DEPLOY: ${{ inputs.deploy || false }}
          REPLACE_ATTACHMENT: ${{ inputs.replace_attachment || false }}
        run: |
          set -eu
          case "$JOB_FILE" in tools/art/jobs/*) ;; *) echo 'Unsafe job path'; exit 1;; esac
          if [ "$DEPLOY" = true ] && [ "$PUBLISH" = true ]; then
            echo 'Select either publish (assets only) OR deploy (attach prototype), not both'; exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ "$DEPLOY" = true ]; then
            if [ "$REPLACE_ATTACHMENT" = true ]; then
              /usr/bin/python3 tools/art/produce_factorio_asset.py --job "$JOB_FILE" --deploy --replace-attachment
            else
              /usr/bin/python3 tools/art/produce_factorio_asset.py --job "$JOB_FILE" --deploy
            fi
          elif [ "$PUBLISH" = true ]; then
            /usr/bin/python3 tools/art/produce_factorio_asset.py --job "$JOB_FILE" --publish
          else
            /usr/bin/python3 tools/art/produce_factorio_asset.py --job "$JOB_FILE"
          fi
      - name: Validate bounded Solar Boiler V4 wood and feathered steam source
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          echo '1c80875d30a82127a3edb712715ac2ec8b5a42eea87acad09044d4fbca94c6c0  tools/art/jobs/solar-boiler-v4-wood-sources.tar.gz' | sha256sum -c -
          test -s models/island-survival/solar-boiler/generated-v3/solar-boiler-v3.blend
          test -s models/island-survival/blender/generated-v8/campfire-v8-animated.blend
          mkdir -p models/island-survival/solar-boiler/v4
          tar xzf tools/art/jobs/solar-boiler-v4-wood-sources.tar.gz -C models/island-survival/solar-boiler/v4
          # Blender truncates long display names to 63 bytes. Count the
          # retained per-object role identifier rather than a suffix in the name.
          /usr/bin/python3 - <<'PY'
          from pathlib import Path
          p=Path('models/island-survival/solar-boiler/v4/verify_solar_boiler_v4.py')
          source=p.read_text()
          old="conduits=[o for o in s.objects if o.name.startswith('WOOD PIPE V4 |') and 'bent stave' in o.name]"
          new="conduits=[o for o in s.objects if o.get('wood_role')=='curved planking on hollow conduit']"
          assert source.count(old)==1
          p.write_text(source.replace(old,new))
          PY
          # Normalize only trailing whitespace in derived V4 source files
          # before Git's source-integrity whitespace gate. The native model and
          # real Blender renders are reused from the previous verified artifact.
          /usr/bin/python3 - <<'PY'
          from pathlib import Path
          source_dir=Path('models/island-survival/solar-boiler/v4')
          changed=[]
          for path in sorted(source_dir.iterdir()):
              if path.suffix not in ('.py','.md','.json'):
                  continue
              data=path.read_text()
              clean='\n'.join(line.rstrip() for line in data.splitlines())+'\n'
              if clean != data:
                  path.write_text(clean)
                  changed.append(path.name)
          print('SOURCE_TRAILING_WHITESPACE_FIXED',changed,flush=True)
          PY
          /usr/bin/python3 -m py_compile models/island-survival/solar-boiler/v4/*.py
          /usr/bin/python3 models/island-survival/solar-boiler/v4/build_solar_boiler_v4.py --self-check
      - name: Recover successful V4 Blender model and actual 26-render evidence
        if: github.event_name == 'push'
        uses: actions/download-artifact@v4
        with:
          name: factorio-four-way-production-evidence
          run-id: 42929600944
          github-token: ${{ github.token }}
          path: models
      - name: Independently re-open V4 source and finish V4 pilot QA (no rerender)
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          test -s models/island-survival/solar-boiler/generated-v4/solar-boiler-v4.blend
          blender -b -t 4 models/island-survival/solar-boiler/generated-v4/solar-boiler-v4.blend --python-exit-code 1 --python models/island-survival/solar-boiler/v4/verify_solar_boiler_v4.py -- --output models/island-survival/solar-boiler/generated-v4
          /usr/bin/python3 models/island-survival/solar-boiler/v4/make_proof_sheet.py --output models/island-survival/solar-boiler/generated-v4
      - name: Publish verified V4 wood model only, no live Factorio sprite attachment
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "main"
          /usr/bin/python3 - <<'PY'
          import json
          from pathlib import Path
          out=Path('models/island-survival/solar-boiler/generated-v4')
          q=json.loads((out/'proof-qa.json').read_text())
          n=json.loads((out/'native-reopen-qa.json').read_text())
          assert q['passed'] and n['passed'] and q['actual_blender_views']==24
          assert q['steam_changed_rgb_pixels']>=18 and n['barrel_staves']==18
          assert n['wood_plank_conduits']>=60 and len(n['polished_parabolic_wood'])==2
          assert not q['game_integrated'] and not q['visual_approved']
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- models/island-survival/solar-boiler/v4 models/island-survival/solar-boiler/generated-v4
          git rm -- tools/art/jobs/solar-boiler-v4-wood-sources.tar.gz
          git diff --cached --check
          git diff --cached --quiet && { echo 'No wood-build evidence to publish'; exit 1; }
          git commit -m 'art(solar-boiler): V4 wooden barrel, plank pipes, polished wood mirrors, feathered relief [skip ci]'
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              local_sha="$(git rev-parse HEAD)"
              remote_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
              test "$local_sha" = "$remote_sha"
              echo "SOLAR_V4_WOOD_PROOF_COMMIT_VERIFIED $local_sha"
              exit 0
            fi
            echo "Bounded non-force push retry $attempt"
          done
          exit 1
      - name: Retain review and Blender evidence even after failed render
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factorio-four-way-production-evidence
          path: |
            models/sprite-production/
            models/island-survival/solar-boiler/generated-v4/
          if-no-files-found: warn
