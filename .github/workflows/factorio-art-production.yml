name: Factorio reusable four-way art production

on:
  workflow_dispatch:
    inputs:
      job:
        description: Repository-relative production job JSON
        required: false
        default: tools/art/jobs/campfire-next.json
      publish:
        description: Render/install graphics only and publish
        type: boolean
        required: false
        default: false
      deploy:
        description: Render/install graphics, attach prototype, publish
        type: boolean
        required: false
        default: false
      replace_attachment:
        description: Replace an older managed attachment for the same prototype
        type: boolean
        required: false
        default: false
  push:
    branches: [main]
    paths:
      # One deliberately bounded request; never re-run completed Cooking Fire art.
      - tools/art/jobs/fish-pond-v1-proof.json

permissions:
  contents: write
concurrency:
  group: factorio-reusable-art-production
  cancel-in-progress: false

jobs:
  four-way-export:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install Blender and image tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender python3-pil lua5.4
          blender --version | head -3
      - name: Run all export regression tests
        run: |
          /usr/bin/python3 -m unittest discover -s tools/art -p 'test_*.py' -v
      - name: Execute reusable pipeline (full render on manual run)
        if: github.event_name == 'workflow_dispatch'
        env:
          JOB_FILE: ${{ github.event_name == 'push' && 'tools/art/jobs/cooking-fire-v2.json' || inputs.job || 'tools/art/jobs/campfire-next.json' }}
          PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.publish || false }}
          DEPLOY: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy || false }}
          REPLACE_ATTACHMENT: ${{ github.event_name == 'workflow_dispatch' && inputs.replace_attachment || false }}
        run: |
          set -eu
          case "$JOB_FILE" in tools/art/jobs/*) ;; *) echo 'Unsafe job path'; exit 1;; esac
          if [ "$DEPLOY" = true ] && [ "$PUBLISH" = true ]; then
            echo 'Select either publish (assets only) OR deploy (attach prototype), not both'; exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ "$DEPLOY" = true ]; then
            if [ "$REPLACE_ATTACHMENT" = true ]; then
              /usr/bin/python3 tools/art/produce_factorio_asset.py --job "$JOB_FILE" --deploy --replace-attachment
            else
              /usr/bin/python3 tools/art/produce_factorio_asset.py --job "$JOB_FILE" --deploy
            fi
          elif [ "$PUBLISH" = true ]; then
            /usr/bin/python3 tools/art/produce_factorio_asset.py --job "$JOB_FILE" --publish
          else
            /usr/bin/python3 tools/art/produce_factorio_asset.py --job "$JOB_FILE"
          fi
      - name: Construct Fish Pond V1 editable Blender candidate (no game edits)
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          /usr/bin/python3 -m py_compile models/island-survival/fish-pond/v1/*.py
          /usr/bin/python3 models/island-survival/fish-pond/v1/build_fish_pond_v1.py --self-check
          blender -b -t 4 --factory-startup --python models/island-survival/fish-pond/v1/build_fish_pond_v1.py -- --out models/island-survival/fish-pond/generated-v1 --render proof --samples 24
          blender -b -t 4 models/island-survival/fish-pond/generated-v1/fish-pond-v1.blend --python models/island-survival/fish-pond/v1/verify_fish_pond_v1.py
          /usr/bin/python3 models/island-survival/fish-pond/v1/make_proof_sheet.py models/island-survival/fish-pond/generated-v1
      - name: Publish Fish Pond native proof candidate and verify main readback
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          test "$(git branch --show-current)" = main
          /usr/bin/python3 - <<'PY'
          import json
          from pathlib import Path
          receipt=json.loads(Path('models/island-survival/fish-pond/generated-v1/proof-qa.json').read_text())
          assert receipt['passed'] and receipt['actual_blender_renders']==8
          assert not receipt['visual_approved'] and not receipt['game_integrated']
          PY
          git add -- models/island-survival/fish-pond/generated-v1
          git diff --cached --check
          git diff --cached --quiet && { echo 'No new proof to publish'; exit 1; }
          git commit -m 'art(fish-pond): native V1 and cardinal Blender proof [skip ci]'
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              local_sha="$(git rev-parse HEAD)"
              remote_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
              test "$local_sha" = "$remote_sha"
              echo "FISH_POND_NATIVE_MODEL_COMMIT_VERIFIED $local_sha"
              exit 0
            fi
            echo "Bounded retry $attempt"
          done
          exit 1
      - name: Retain review and Blender evidence even after failed render
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factorio-four-way-production-evidence
          path: |
            models/sprite-production/
            models/island-survival/fish-pond/generated-v1/
          if-no-files-found: warn
