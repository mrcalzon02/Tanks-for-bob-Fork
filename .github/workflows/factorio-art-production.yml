name: Factorio reusable four-way art production

on:
  workflow_dispatch:
    inputs:
      job:
        description: Repository-relative production job JSON
        required: false
        default: tools/art/jobs/campfire-next.json
      publish:
        description: Render/install graphics only and publish
        type: boolean
        required: false
        default: false
      deploy:
        description: Render/install graphics, attach prototype, publish
        type: boolean
        required: false
        default: false
      replace_attachment:
        description: Replace an older managed attachment for the same prototype
        type: boolean
        required: false
        default: false
  push:
    branches: [main]
    paths:
      - tools/art/jobs/solar-boiler-v4b-steam-proof.json

permissions:
  contents: write
  actions: read
concurrency:
  group: factorio-reusable-art-production
  cancel-in-progress: false

jobs:
  four-way-export:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install Blender and image tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender python3-pil lua5.4
          blender --version | head -3
      - name: Run all export regression tests
        run: |
          /usr/bin/python3 -m unittest discover -s tools/art -p 'test_*.py' -v
      - name: Execute reusable pipeline (full render on manual run)
        if: github.event_name == 'workflow_dispatch'
        env:
          JOB_FILE: ${{ inputs.job || 'tools/art/jobs/campfire-next.json' }}
          PUBLISH: ${{ inputs.publish || false }}
          DEPLOY: ${{ inputs.deploy || false }}
          REPLACE_ATTACHMENT: ${{ inputs.replace_attachment || false }}
        run: |
          set -eu
          case "$JOB_FILE" in tools/art/jobs/*) ;; *) echo 'Unsafe job path'; exit 1;; esac
          if [ "$DEPLOY" = true ] && [ "$PUBLISH" = true ]; then
            echo 'Select either publish (assets only) OR deploy (attach prototype), not both'; exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ "$DEPLOY" = true ]; then
            if [ "$REPLACE_ATTACHMENT" = true ]; then
              /usr/bin/python3 tools/art/produce_factorio_asset.py --job "$JOB_FILE" --deploy --replace-attachment
            else
              /usr/bin/python3 tools/art/produce_factorio_asset.py --job "$JOB_FILE" --deploy
            fi
          elif [ "$PUBLISH" = true ]; then
            /usr/bin/python3 tools/art/produce_factorio_asset.py --job "$JOB_FILE" --publish
          else
            /usr/bin/python3 tools/art/produce_factorio_asset.py --job "$JOB_FILE"
          fi
      - name: Read source checksum and executable steam derivative preflight
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          echo '199dd2d961b4a24eb7178a49f863ea5f10c7e1a3a13b5ade53d67453e1bf7ce5  tools/art/jobs/solar-boiler-v4b-steam-sources.tar.gz' | sha256sum -c -
          test -s models/island-survival/solar-boiler/generated-v4/solar-boiler-v4.blend
          mkdir -p models/island-survival/solar-boiler/v4b
          tar xzf tools/art/jobs/solar-boiler-v4b-steam-sources.tar.gz -C models/island-survival/solar-boiler/v4b
          /usr/bin/python3 -m py_compile models/island-survival/solar-boiler/v4b/*.py
          /usr/bin/python3 models/island-survival/solar-boiler/v4b/refine_steam_v4b.py --self-check
      - name: Render actual V4b Cycles steam visibility pilot and independently reopen native file
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          blender -b -t 4 --factory-startup --python-exit-code 1 --python models/island-survival/solar-boiler/v4b/refine_steam_v4b.py -- --output models/island-survival/solar-boiler/generated-v4b --render pilot --samples 24
          blender -b -t 4 models/island-survival/solar-boiler/generated-v4b/solar-boiler-v4b.blend --python-exit-code 1 --python models/island-survival/solar-boiler/v4b/verify_steam_v4b.py -- --output models/island-survival/solar-boiler/generated-v4b
          /usr/bin/python3 models/island-survival/solar-boiler/v4b/make_steam_proof.py --output models/island-survival/solar-boiler/generated-v4b
      - name: Publish only checked V4b Blender and real animated visual evidence
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "main"
          /usr/bin/python3 - <<'PY'
          import json
          from pathlib import Path
          o=Path('models/island-survival/solar-boiler/generated-v4b')
          proof=json.loads((o/'proof-qa.json').read_text())
          native=json.loads((o/'native-reopen-qa.json').read_text())
          assert native['passed'] and proof['passed'] and proof['actual_blender_views']==24
          assert proof['same_frame_steam_pixels_256']>=70 and proof['same_frame_steam_pixels_64']>=3
          assert native['wood_staves']==18 and native['bentwood_conduits']==65
          assert native['wood_parabolic_mirrors']==2 and len(native['full_port_mating'])==3
          assert not proof['visual_approved'] and not proof['game_integrated']
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- models/island-survival/solar-boiler/v4b models/island-survival/solar-boiler/generated-v4b
          git rm -- tools/art/jobs/solar-boiler-v4b-steam-sources.tar.gz
          git diff --cached --check
          git diff --cached --quiet && { echo 'No V4b source/proof changes'; exit 1; }
          git commit -m 'art(solar-boiler): brighter feathered 3D relief steam on wooden V4 [skip ci]'
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              local_sha="$(git rev-parse HEAD)"
              remote_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
              test "$local_sha" = "$remote_sha"
              echo "SOLAR_V4B_STEAM_PROOF_COMMIT_VERIFIED $local_sha"
              exit 0
            fi
            echo "Bounded non-force push retry $attempt"
          done
          exit 1
      - name: Retain review and Blender evidence even after failed render
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factorio-four-way-production-evidence
          path: |
            models/sprite-production/
            models/island-survival/solar-boiler/generated-v4b/
          if-no-files-found: warn
