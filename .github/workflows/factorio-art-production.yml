name: Factorio reusable four-way art production

on:
  workflow_dispatch:
    inputs:
      job:
        description: Repository-relative production job JSON
        required: false
        default: tools/art/jobs/campfire-next.json
      publish:
        description: Render/install graphics only and publish
        type: boolean
        required: false
        default: false
      deploy:
        description: Render/install graphics, attach prototype, publish
        type: boolean
        required: false
        default: false
      replace_attachment:
        description: Replace an older managed attachment for the same prototype
        type: boolean
        required: false
        default: false
  push:
    branches: [main]
    paths:
      - tools/art/jobs/solar-boiler-v2-proof.json

permissions:
  contents: write
concurrency:
  group: factorio-reusable-art-production
  cancel-in-progress: false

jobs:
  four-way-export:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install Blender and image tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender python3-pil lua5.4
          blender --version | head -3
      - name: Run all export regression tests
        run: |
          /usr/bin/python3 -m unittest discover -s tools/art -p 'test_*.py' -v
      - name: Execute reusable pipeline (full render on manual run)
        if: github.event_name == 'workflow_dispatch'
        env:
          JOB_FILE: ${{ inputs.job || 'tools/art/jobs/campfire-next.json' }}
          PUBLISH: ${{ inputs.publish || false }}
          DEPLOY: ${{ inputs.deploy || false }}
          REPLACE_ATTACHMENT: ${{ inputs.replace_attachment || false }}
        run: |
          set -eu
          case "$JOB_FILE" in tools/art/jobs/*) ;; *) echo 'Unsafe job path'; exit 1;; esac
          if [ "$DEPLOY" = true ] && [ "$PUBLISH" = true ]; then
            echo 'Select either publish (assets only) OR deploy (attach prototype), not both'; exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ "$DEPLOY" = true ]; then
            if [ "$REPLACE_ATTACHMENT" = true ]; then
              /usr/bin/python3 tools/art/produce_factorio_asset.py --job "$JOB_FILE" --deploy --replace-attachment
            else
              /usr/bin/python3 tools/art/produce_factorio_asset.py --job "$JOB_FILE" --deploy
            fi
          elif [ "$PUBLISH" = true ]; then
            /usr/bin/python3 tools/art/produce_factorio_asset.py --job "$JOB_FILE" --publish
          else
            /usr/bin/python3 tools/art/produce_factorio_asset.py --job "$JOB_FILE"
          fi
      - name: Unpack bounded V2 source and test real parabolic geometry
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          echo 'b0220597997ba928074ac47fa1eb7fa7e05c36ae6b8bd34679b33da547af995d  tools/art/jobs/solar-boiler-v2-proof-sources.tar.gz' | sha256sum -c -
          test -s models/island-survival/solar-boiler/generated-v1/solar-boiler-v1.blend
          mkdir -p models/island-survival/solar-boiler/v2
          tar -xzf tools/art/jobs/solar-boiler-v2-proof-sources.tar.gz -C models/island-survival/solar-boiler/v2
          /usr/bin/python3 -m py_compile models/island-survival/solar-boiler/v2/*.py
          /usr/bin/python3 models/island-survival/solar-boiler/v2/refine_solar_boiler_v2.py --self-check
      - name: Render and independently verify V2 native Blender derivative
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          blender -b -t 4 --factory-startup --python-exit-code 1 --python models/island-survival/solar-boiler/v2/refine_solar_boiler_v2.py -- --output models/island-survival/solar-boiler/generated-v2 --render proof --samples 24
          blender -b -t 4 models/island-survival/solar-boiler/generated-v2/solar-boiler-v2.blend --python-exit-code 1 --python models/island-survival/solar-boiler/v2/verify_solar_boiler_v2.py -- --output models/island-survival/solar-boiler/generated-v2
          /usr/bin/python3 models/island-survival/solar-boiler/v2/make_proof_sheet.py --output models/island-survival/solar-boiler/generated-v2
      - name: Commit source plus verified V2 model and proof only
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = main
          /usr/bin/python3 -c "import json;from pathlib import Path;p=Path('models/island-survival/solar-boiler/generated-v2');q=json.loads((p/'proof-qa.json').read_text());assert q['passed'] and q['native_reopen'] and q['actual_blender_views']==8 and not q['visual_approved'] and not q['game_integrated']"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- models/island-survival/solar-boiler/v2 models/island-survival/solar-boiler/generated-v2
          git rm -- tools/art/jobs/solar-boiler-v2-proof-sources.tar.gz
          git diff --cached --check
          git diff --cached --quiet && { echo 'No new V2 modeling evidence'; exit 1; }
          git commit -m 'art(solar-boiler): true parabolic thermal troughs with focal receivers [skip ci]'
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              local_sha="$(git rev-parse HEAD)"
              remote_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
              test "$local_sha" = "$remote_sha"
              echo "SOLAR_BOILER_V2_NATIVE_PROOF_COMMIT_VERIFIED $local_sha"
              exit 0
            fi
            echo "Bounded non-force retry $attempt"
          done
          exit 1
      - name: Retain review and Blender evidence even after failed render
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factorio-four-way-production-evidence
          path: |
            models/sprite-production/
            models/island-survival/solar-boiler/generated-v2/
          if-no-files-found: warn
