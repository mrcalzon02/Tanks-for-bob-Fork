name: Factorio reusable four-way art production

on:
  workflow_dispatch:
    inputs:
      job:
        description: Repository-relative production job JSON
        required: false
        default: tools/art/jobs/campfire-next.json
      publish:
        description: Render/install graphics only and publish
        type: boolean
        required: false
        default: false
      deploy:
        description: Render/install graphics, attach prototype, publish
        type: boolean
        required: false
        default: false
      replace_attachment:
        description: Replace an older managed attachment for the same prototype
        type: boolean
        required: false
        default: false
  push:
    branches: [main]
    paths:
      - tools/art/jobs/solar-boiler-v5-proof.json

permissions:
  contents: write
  actions: read
concurrency:
  group: factorio-reusable-art-production
  cancel-in-progress: false

jobs:
  four-way-export:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install Blender and image tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender python3-pil lua5.4
          blender --version | head -3
      - name: Run all export regression tests
        run: |
          /usr/bin/python3 -m unittest discover -s tools/art -p 'test_*.py' -v
      - name: Execute reusable pipeline (full render on manual run)
        if: github.event_name == 'workflow_dispatch'
        env:
          JOB_FILE: ${{ inputs.job || 'tools/art/jobs/campfire-next.json' }}
          PUBLISH: ${{ inputs.publish || false }}
          DEPLOY: ${{ inputs.deploy || false }}
          REPLACE_ATTACHMENT: ${{ inputs.replace_attachment || false }}
        run: |
          set -eu
          case "$JOB_FILE" in tools/art/jobs/*) ;; *) echo 'Unsafe job path'; exit 1;; esac
          if [ "$DEPLOY" = true ] && [ "$PUBLISH" = true ]; then
            echo 'Select either publish (assets only) OR deploy (attach prototype), not both'; exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ "$DEPLOY" = true ]; then
            if [ "$REPLACE_ATTACHMENT" = true ]; then
              /usr/bin/python3 tools/art/produce_factorio_asset.py --job "$JOB_FILE" --deploy --replace-attachment
            else
              /usr/bin/python3 tools/art/produce_factorio_asset.py --job "$JOB_FILE" --deploy
            fi
          elif [ "$PUBLISH" = true ]; then
            /usr/bin/python3 tools/art/produce_factorio_asset.py --job "$JOB_FILE" --publish
          else
            /usr/bin/python3 tools/art/produce_factorio_asset.py --job "$JOB_FILE"
          fi
      - name: Validate exact source hashes and V5 glass/fluid/wood preflight
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          echo '02cd19ca7bb8837122f4fa937dbb9d31871c5d93fb57e278349781d75cc2d6c2  tools/art/jobs/solar-boiler-v5-source.tar.gz' | sha256sum -c -
          test -s models/island-survival/solar-boiler/generated-v4/solar-boiler-v4.blend
          test -s models/island-survival/solar-boiler/generated-v4/build-report.json
          mkdir -p models/island-survival/solar-boiler/v5
          tar -xzf tools/art/jobs/solar-boiler-v5-source.tar.gz -C models/island-survival/solar-boiler/v5
          /usr/bin/python3 -m py_compile models/island-survival/solar-boiler/v5/*.py
          /usr/bin/python3 models/island-survival/solar-boiler/v5/build_solar_boiler_v5.py --self-check
      - name: Construct authentic native Blender V5 and render the 4-way pilot
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          blender -b -t 4 --factory-startup --python-exit-code 1 --python models/island-survival/solar-boiler/v5/build_solar_boiler_v5.py -- --output models/island-survival/solar-boiler/generated-v5 --render proof --samples 24
          blender -b -t 4 models/island-survival/solar-boiler/generated-v5/solar-boiler-v5.blend --python-exit-code 1 --python models/island-survival/solar-boiler/v5/verify_solar_boiler_v5.py -- --output models/island-survival/solar-boiler/generated-v5
          /usr/bin/python3 models/island-survival/solar-boiler/v5/make_proof_sheet.py --output models/island-survival/solar-boiler/generated-v5
      - name: Commit V5 native source, true Cycles proof and geometry QA only
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = main
          /usr/bin/python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('models/island-survival/solar-boiler/generated-v5')
          q=json.loads((p/'proof-qa.json').read_text())
          n=json.loads((p/'native-reopen-qa.json').read_text())
          assert q['passed'] and n['passed'] and q['native_reopen']
          assert q['actual_blender_views']==24 and q['isolation_render_count']==4
          assert n['glass_walls_are_thick_3d'] and n['bubbles']>=20
          assert n['wood_staves']==18 and n['wood_conduit_planks']==65
          assert len(n['roof_socket_patches'])==2 and len(n['existing_ports'])==3
          assert q['two_end_steam_effect_pixels']['pixel_changes_64']>=2
          assert q['glass_fluid_effect_pixels']['pixel_changes_64']>=3
          assert not q['game_integrated'] and not q['visual_approved']
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- models/island-survival/solar-boiler/v5 models/island-survival/solar-boiler/generated-v5
          git rm -- tools/art/jobs/solar-boiler-v5-source.tar.gz
          git diff --cached --check
          git diff --cached --quiet && { echo 'No new native V5 evidence to publish'; exit 1; }
          git commit -m 'art(solar-boiler): wooden socket repair and glass boiling accumulator V5 [skip ci]'
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              local_sha="$(git rev-parse HEAD)"
              remote_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
              test "$local_sha" = "$remote_sha"
              echo "SOLAR_V5_GLASS_ACCUMULATOR_PROOF_COMMIT_VERIFIED $local_sha"
              exit 0
            fi
            echo "Bounded nonforce push retry $attempt"
          done
          exit 1
      - name: Retain review and Blender evidence even after failed render
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factorio-four-way-production-evidence
          path: |
            models/sprite-production/
            models/island-survival/solar-boiler/generated-v5/
          if-no-files-found: warn
