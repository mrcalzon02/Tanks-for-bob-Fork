name: Factorio reusable four-way art production

on:
  push:
    branches: [main]
    paths:
      - 'models/island-survival/solar-boiler/v7/**'
  workflow_dispatch:
    inputs:
      job:
        description: Repository-relative production job JSON
        required: false
        default: tools/art/jobs/campfire-next.json
      publish:
        description: Render/install graphics only and publish
        type: boolean
        required: false
        default: false
      deploy:
        description: Render/install graphics, attach prototype, publish
        type: boolean
        required: false
        default: false
      replace_attachment:
        description: Replace an older managed attachment for the same prototype
        type: boolean
        required: false
        default: false

permissions:
  contents: write
concurrency:
  group: factorio-reusable-art-production
  cancel-in-progress: false

jobs:
  four-way-export:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install Blender and image tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender python3-pil lua5.4
          blender --version | head -3
      - name: Run all export regression tests
        run: |
          /usr/bin/python3 -m unittest discover -s tools/art -p 'test_*.py' -v
      - name: Execute reusable pipeline (full render on manual run)
        if: github.event_name == 'workflow_dispatch'
        env:
          JOB_FILE: ${{ inputs.job || 'tools/art/jobs/campfire-next.json' }}
          PUBLISH: ${{ inputs.publish || false }}
          DEPLOY: ${{ inputs.deploy || false }}
          REPLACE_ATTACHMENT: ${{ inputs.replace_attachment || false }}
        run: |
          set -eu
          case "$JOB_FILE" in tools/art/jobs/*) ;; *) echo 'Unsafe job path'; exit 1;; esac
          if [ "$DEPLOY" = true ] && [ "$PUBLISH" = true ]; then
            echo 'Select either publish (assets only) OR deploy (attach prototype), not both'; exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ "$DEPLOY" = true ]; then
            if [ "$REPLACE_ATTACHMENT" = true ]; then
              /usr/bin/python3 tools/art/produce_factorio_asset.py --job "$JOB_FILE" --deploy --replace-attachment
            else
              /usr/bin/python3 tools/art/produce_factorio_asset.py --job "$JOB_FILE" --deploy
            fi
          elif [ "$PUBLISH" = true ]; then
            /usr/bin/python3 tools/art/produce_factorio_asset.py --job "$JOB_FILE" --publish
          else
            /usr/bin/python3 tools/art/produce_factorio_asset.py --job "$JOB_FILE"
          fi
      - name: Build and publish corrected Solar Boiler V7 ground-lock animation
        if: github.event_name == 'push'
        run: |
          set -eu
          python3 models/island-survival/solar-boiler/v7/refine_solar_boiler_v7.py --self-check
          blender -b -t 4 --factory-startup --python-exit-code 1 \
            --python models/island-survival/solar-boiler/v7/refine_solar_boiler_v7.py -- \
            --output models/island-survival/solar-boiler/generated-v7 --render all --samples 24
          blender -b -t 4 models/island-survival/solar-boiler/generated-v7/solar-boiler-v7.blend \
            --python-exit-code 1 --python models/island-survival/solar-boiler/v7/verify_solar_boiler_v7.py -- \
            --output models/island-survival/solar-boiler/generated-v7
          /usr/bin/python3 models/island-survival/solar-boiler/v7/make_proof_sheet.py \
            --output models/island-survival/solar-boiler/generated-v7
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add models/island-survival/solar-boiler/generated-v7/
          git commit -m 'art(solar-boiler): render grounded V7 4-view Blender review [skip ci]'
          git push origin HEAD:main
      - name: Retain review and Blender evidence even after failed render
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factorio-four-way-production-evidence
          path: models/sprite-production/
          if-no-files-found: warn
